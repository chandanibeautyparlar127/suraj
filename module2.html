<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 2 — Sentence Structure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Same design tokens as module1 */
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070913;--surface:#101425;--surface-2:#141a2e;--purple:#8b5cf6;--purple-light:#a78bfa;--blue:#3b82f6;--text:#f8fafc;--text-muted:#94a3b8;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.14);--grad:linear-gradient(135deg,#a78bfa,#8b5cf6,#3b82f6);--r:20px;--shadow:0 18px 50px -20px rgba(0,0,0,.85);--glow:0 0 0 1px rgba(139,92,246,.45),0 18px 60px -18px rgba(139,92,246,.55)}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:"Outfit",system-ui,sans-serif;line-height:1.6;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--purple),var(--blue));border-radius:999px;border:2px solid var(--bg)}
.mono{font-family:"Space Grotesk",monospace}
.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(120px)}
.orb-p{width:520px;height:520px;background:#8b5cf6;top:-160px;left:-120px;opacity:.4;animation:float 18s ease-in-out infinite}
.orb-b{width:560px;height:560px;background:#3b82f6;top:30%;right:-200px;opacity:.3;animation:float 22s ease-in-out infinite reverse}
.orb-v{width:460px;height:460px;background:#a78bfa;bottom:-180px;left:35%;opacity:.22;animation:float 26s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(40px,-50px,0) scale(1.12)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
.fade-up{opacity:0;animation:fadeUp .7s cubic-bezier(.22,1,.36,1) forwards}
.container{width:100%;max-width:1180px;margin-inline:auto;padding-inline:24px;position:relative;z-index:1}
header{position:sticky;top:0;z-index:100;background:rgba(10,13,26,.6);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--border)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;height:70px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);font-weight:700;font-size:1.05rem}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-family:"Space Grotesk",monospace;font-size:.9rem;font-weight:700;color:#fff}
.crumb{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--text-muted);flex-wrap:wrap}
.crumb a{color:var(--text-muted);text-decoration:none;transition:color .2s}
.crumb a:hover{color:var(--purple-light)}
.crumb .sep{opacity:.4}
.crumb .cur{color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:"Outfit",sans-serif;font-size:.88rem;font-weight:600;padding:10px 20px;border-radius:999px;border:1px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap;transition:all .25s}
.btn-primary{color:#fff;background:var(--grad);background-size:180% 180%;animation:gradShift 7s ease infinite;box-shadow:0 12px 34px -14px rgba(139,92,246,.95)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 18px 46px -14px rgba(139,92,246,1)}
.btn-ghost{color:var(--text);background:rgba(255,255,255,.03);border-color:var(--border-strong);backdrop-filter:blur(10px)}
.btn-ghost:hover{transform:translateY(-2px);border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.1)}
.btn-sm{padding:8px 16px;font-size:.82rem}
.page{padding:40px 0 100px;min-height:80vh}
.section-title{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-bottom:12px}
.section-sub{color:var(--text-muted);font-weight:300;margin-bottom:40px;max-width:620px}
.eyebrow{font-family:"Space Grotesk",monospace;font-size:.72rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:22px}
.card{position:relative;padding:28px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;transition:all .35s cubic-bezier(.22,1,.36,1);cursor:pointer}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);opacity:.7;transition:opacity .35s}
.card::after{content:"";position:absolute;top:-60%;left:50%;width:340px;height:340px;transform:translateX(-50%);background:radial-gradient(circle,rgba(139,92,246,.22),transparent 68%);opacity:0;transition:opacity .45s;pointer-events:none}
.card:hover{transform:translateY(-5px);border-color:rgba(139,92,246,.6);background:var(--surface-2);box-shadow:var(--glow),var(--shadow)}
.card:hover::before{opacity:0}
.card:hover::after{opacity:1}
.card-icon{position:relative;z-index:1;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:1.25rem;margin-bottom:20px;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.28);color:var(--purple-light);transition:all .35s}
.card:hover .card-icon{background:rgba(139,92,246,.2);border-color:rgba(167,139,250,.55);transform:translateY(-2px)}
.card h3{position:relative;z-index:1;font-size:1.1rem;font-weight:600;margin-bottom:8px}
.card p{position:relative;z-index:1;font-size:.9rem;font-weight:300;line-height:1.65;color:var(--text-muted)}
.card-tag{position:relative;z-index:1;display:inline-block;margin-top:16px;padding:5px 12px;border-radius:999px;border:1px solid var(--border);font-family:"Space Grotesk",monospace;font-size:.64rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
.detail{display:grid;gap:20px}
.hero-verb{padding:36px;border-radius:var(--r);background:linear-gradient(160deg,rgba(139,92,246,.14),rgba(59,130,246,.06)),var(--surface);border:1px solid rgba(139,92,246,.25);box-shadow:var(--shadow)}
.hero-verb .v-big{font-size:clamp(1.8rem,4.5vw,2.6rem);font-weight:800;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.hero-verb .v-meaning{font-size:1.05rem;color:var(--text);font-weight:500;margin-bottom:14px}
.hero-verb .v-use{font-size:.92rem;color:var(--text-muted);font-weight:300}
.hero-verb .v-use b{color:var(--purple-light);font-weight:600}
.rules-box{padding:26px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border)}
.rules-box h4{font-family:"Space Grotesk",monospace;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--purple-light);margin-bottom:14px}
.rules-box pre{font-family:"Space Grotesk",monospace;font-size:.86rem;color:var(--text);line-height:1.9;white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,.25);padding:16px;border-radius:12px;border:1px solid var(--border)}
.sent-card{padding:24px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:12px;transition:all .3s}
.sent-card:hover{border-color:rgba(139,92,246,.4);box-shadow:0 12px 40px -18px rgba(139,92,246,.5)}
.sent-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sent-label{font-family:"Space Grotesk",monospace;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted)}
.sent-text{font-size:1.05rem;font-weight:400;color:var(--text);line-height:1.5;padding:12px 16px;background:rgba(0,0,0,.25);border-radius:12px;border-left:3px solid var(--purple)}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);text-decoration:none;font-size:.88rem;margin-bottom:24px;transition:color .2s}
.back-link:hover{color:var(--purple-light)}
.modal-overlay{position:fixed;inset:0;background:rgba(4,6,15,.85);backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;animation:fadeIn .3s}
.modal-overlay.open{display:flex}
.modal{width:100%;max-width:640px;max-height:92vh;overflow-y:auto;background:var(--surface);border:1px solid rgba(139,92,246,.35);border-radius:24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.9);animation:pop .35s cubic-bezier(.22,1,.36,1)}
.modal-head{padding:24px 28px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:sticky;top:0;background:var(--surface);z-index:2;border-radius:24px 24px 0 0}
.modal-head h3{font-size:1.1rem;font-weight:700}
.modal-head .sub{font-family:"Space Grotesk",monospace;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--purple-light);margin-top:4px}
.close-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:1.1rem;display:grid;place-items:center;transition:all .2s;flex-shrink:0}
.close-btn:hover{background:rgba(139,92,246,.2);border-color:rgba(139,92,246,.5)}
.modal-body{padding:24px 28px 28px}
.tabs{display:flex;gap:6px;margin-bottom:22px;background:rgba(0,0,0,.25);padding:5px;border-radius:999px}
.tab{flex:1;padding:9px;border-radius:999px;border:none;background:transparent;color:var(--text-muted);font-family:"Outfit",sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .25s}
.tab.active{background:var(--grad);color:#fff;box-shadow:0 8px 20px -8px rgba(139,92,246,.9)}
.progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-family:"Space Grotesk",monospace;font-size:.78rem;color:var(--text-muted)}
.progress-bar{height:6px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden;margin-bottom:22px}
.progress-fill{height:100%;background:var(--grad);border-radius:999px;transition:width .4s;width:0%}
.q-text{font-size:1.15rem;font-weight:500;line-height:1.6;margin-bottom:22px;padding:20px;background:rgba(0,0,0,.25);border-radius:14px;border-left:3px solid var(--purple)}
.q-text .blank{color:var(--purple-light);font-weight:700;letter-spacing:.1em}
.options{display:grid;gap:10px;margin-bottom:20px}
.opt{padding:14px 18px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--text);font-family:"Outfit",sans-serif;font-size:.98rem;font-weight:500;cursor:pointer;text-align:left;transition:all .2s;display:flex;align-items:center;gap:10px}
.opt:hover:not(.disabled){background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.45);transform:translateX(3px)}
.opt .key{font-family:"Space Grotesk",monospace;font-size:.72rem;width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,.06);display:grid;place-items:center;color:var(--text-muted)}
.opt.correct{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.6);color:#86efac}
.opt.wrong{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.6);color:#fca5a5}
.opt.disabled{cursor:not-allowed;opacity:.7}
.feedback{margin-top:14px;padding:12px 16px;border-radius:12px;font-size:.9rem;font-weight:500;display:none}
.feedback.show{display:block;animation:fadeIn .3s}
.feedback.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);color:#86efac}
.feedback.bad{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5}
.modal-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:16px;border-top:1px solid var(--border);margin-top:8px}
.score-chip{font-family:"Space Grotesk",monospace;font-size:.82rem;color:var(--text-muted)}
.score-chip b{color:var(--purple-light)}
/* Chat UI for Spoken English */
.chat-wrap{max-width:720px;margin:0 auto}
.chat-box{padding:24px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);min-height:400px;max-height:520px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.msg{max-width:80%;padding:12px 16px;border-radius:16px;font-size:.95rem;line-height:1.55;animation:pop .25s}
.msg.bot{background:var(--surface-2);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
.msg.user{background:var(--grad);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg .hi{display:block;margin-top:6px;font-size:.85em;opacity:.85;font-style:italic}
.chat-input{display:flex;gap:10px}
.chat-input input{flex:1;padding:14px 18px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:"Outfit",sans-serif;font-size:.95rem;outline:none;transition:border-color .2s}
.chat-input input:focus{border-color:rgba(139,92,246,.6)}
.chat-input button{padding:14px 24px}
.quick-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text-muted);font-size:.82rem;cursor:pointer;transition:all .2s;font-family:"Outfit",sans-serif}
.chip:hover{color:var(--text);border-color:rgba(139,92,246,.5);background:rgba(139,92,246,.1)}
@media(max-width:640px){.nav{display:none}.modal-body{padding:20px}.modal-head{padding:20px}}
</style>
</head>
<body>
<div class="orbs"><div class="orb orb-p"></div><div class="orb orb-b"></div><div class="orb orb-v"></div></div>

<header>
  <div class="container header-inner">
    <a href="index.html" class="logo"><span class="logo-mark">EG</span><span>Grammar Hub</span></a>
    <div class="crumb" id="crumb">
      <a href="index.html">Home</a><span class="sep">/</span>
      <a href="module2.html">Module 2</a>
    </div>
  </div>
</header>

<main class="page">
  <div class="container" id="app"></div>
</main>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-head">
      <div><h3 id="m-title">Practice</h3><div class="sub" id="m-sub">Basic</div></div>
      <button class="close-btn" onclick="closePractice()">×</button>
    </div>
    <div class="modal-body">
      <div class="tabs" id="m-tabs"></div>
      <div class="progress-row"><span id="m-progress-text">Question 1 / 7</span><span id="m-score">Score 0</span></div>
      <div class="progress-bar"><div class="progress-fill" id="m-fill"></div></div>
      <div class="q-text" id="m-q"></div>
      <div class="options" id="m-opts"></div>
      <div class="feedback" id="m-fb"></div>
      <div class="modal-foot">
        <span class="score-chip">Correct: <b id="m-correct">0</b> / <span id="m-total">7</span></span>
        <button class="btn btn-primary btn-sm" id="m-next" onclick="nextQuestion()">Next →</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   DATA
   ============================================================ */
const sentences = [
{id:'assertive',title:'Assertive Sentence',hi:'साधारण कथन वाक्य',use:'किसी बात को सीधे बताने के लिए (statement)',s:{simple:'He is a doctor.',neg:'He is not a doctor.',wh:'What is his profession?'},rules:'Structure: Subject + verb + object.\nEnds with a full stop (.).\nCan be positive or negative.'},
{id:'interrogative',title:'Interrogative Sentence',hi:'प्रश्नवाचक वाक्य',use:'सवाल पूछने के लिए',s:{simple:'Is he a doctor?',neg:'Is he not a doctor?',wh:'What is his profession?'},rules:'Structure: Helping verb + subject + main verb + object?\nEnds with a question mark (?).\nStarts with helping verb or wh-word.'},
{id:'imperative',title:'Imperative Sentence',hi:'आदेशात्मक वाक्य',use:'आदेश, निवेदन या सलाह देने के लिए',s:{simple:'Please open the door.',neg:'Do not open the door.',wh:'Why should I open the door?'},rules:'Structure: Verb + object (subject "you" hidden).\nNegative: Do not + verb + object.\nUsed for orders, requests, advice.'},
{id:'exclamatory',title:'Exclamatory Sentence',hi:'विस्मयादिबोधक वाक्य',use:'आश्चर्य, खुशी या दुख व्यक्त करने के लिए',s:{simple:'What a beautiful day!',neg:'What an awful day!',wh:'How beautiful the day is!'},rules:'Structure: What + a/an + adjective + noun!\nOr: How + adjective + subject + verb!\nEnds with an exclamation mark (!).'}
];

const clauses = [
{id:'independent',title:'Independent Clause',hi:'स्वतंत्र उपवाक्य',use:'अपने आप में पूरा वाक्य बन सके',s:{simple:'She went to school.',neg:'She did not go to school.',wh:'Why did she go to school?'},rules:'Has a subject and a verb.\nExpresses a complete thought.\nCan stand alone as a sentence.'},
{id:'dependent',title:'Dependent Clause',hi:'आश्रित उपवाक्य',use:'अकेले पूरा अर्थ नहीं देता, मुख्य वाक्य पर निर्भर',s:{simple:'When she arrived, we ate.',neg:'When she did not arrive, we waited.',wh:'When did she arrive?'},rules:'Has a subject and a verb.\nDoes not express a complete thought.\nNeeds an independent clause.\nTypes: noun, adjective, adverbial.'},
{id:'noun',title:'Noun Clause',hi:'संज्ञा उपवाक्य',use:'वाक्य में संज्ञा का काम करता है',s:{simple:'What he said is true.',neg:'What he said is not false.',wh:'What did he say?'},rules:'Acts as a noun (subject/object).\nStarts with that, what, whether, if, who, etc.\nExample: I know what he wants.'},
{id:'adjective',title:'Adjective Clause',hi:'विशेषण उपवाक्य',use:'किसी संज्ञा की विशेषता बताता है',s:{simple:'The man who came is my uncle.',neg:'The man who came is not my uncle.',wh:'Who is the man who came?'},rules:'Acts as an adjective.\nStarts with who, which, that, whose, whom.\nModifies a noun in the main clause.'},
{id:'adverbial',title:'Adverbial Clause',hi:'क्रिया-विशेषण उपवाक्य',use:'समय, स्थान, कारण, शर्त बताता है',s:{simple:'I will call you when I arrive.',neg:'I will not call you when I arrive.',wh:'When will you call me?'},rules:'Acts as an adverb.\nStarts with when, where, because, if, although, etc.\nModifies the main verb.'}
];

const tenseGroups = {
present:{title:'Present Tense',types:[
{id:'p-indef',title:'Present Indefinite Tense',hi:'सामान्य वर्तमान काल',use:'आदत, सामान्य सत्य, नियमित क्रिया',s:{simple:'He plays cricket.',neg:'He does not play cricket.',wh:'What does he play?'},rules:'Structure: Subject + V1 (+s/es) + object.\nNegative: do/does not + V1.\nQuestion: Do/Does + subject + V1?'},
{id:'p-perf',title:'Present Perfect Tense',hi:'पूर्ण वर्तमान काल',use:'अभी-अभी पूरा हुआ काम, अनुभव',s:{simple:'He has finished the work.',neg:'He has not finished the work.',wh:'What has he finished?'},rules:'Structure: Subject + has/have + V3.\nNegative: has/have not + V3.\nQuestion: Has/Have + subject + V3?'},
{id:'p-cont',title:'Present Continuous Tense',hi:'अपूर्ण वर्तमान काल',use:'अभी चल रहा काम',s:{simple:'He is playing cricket.',neg:'He is not playing cricket.',wh:'What is he playing?'},rules:'Structure: Subject + is/am/are + V1-ing.\nNegative: is/am/are not + V1-ing.\nQuestion: Is/Am/Are + subject + V1-ing?'},
{id:'p-perf-cont',title:'Present Perfect Continuous Tense',hi:'पूर्ण अपूर्ण वर्तमान काल',use:'पिछले समय से अब तक चल रहा काम',s:{simple:'He has been playing since morning.',neg:'He has not been playing since morning.',wh:'Since when has he been playing?'},rules:'Structure: Subject + has/have been + V1-ing + since/for.\nNegative: has/have not been + V1-ing.\nQuestion: Since when/How long + has/have + subject + been + V1-ing?'}
]},
past:{title:'Past Tense',types:[
{id:'pa-indef',title:'Past Indefinite Tense',hi:'सामान्य भूतकाल',use:'बीते समय में पूरा हुआ काम',s:{simple:'He played cricket.',neg:'He did not play cricket.',wh:'What did he play?'},rules:'Structure: Subject + V2 + object.\nNegative: did not + V1.\nQuestion: Did + subject + V1?'},
{id:'pa-perf',title:'Past Perfect Tense',hi:'पूर्ण भूतकाल',use:'एक काम दूसरे से पहले पूरा हुआ',s:{simple:'He had finished the work before I came.',neg:'He had not finished the work before I came.',wh:'What had he finished?'},rules:'Structure: Subject + had + V3.\nNegative: had not + V3.\nQuestion: Had + subject + V3?'},

/* ============================================================
   PRACTICE ENGINE
   ============================================================ */
let P = null;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function genQuestions(type, sentenceType){
  const qs = [];
  const whs = ['What','Where','Why','Who','When','How'];
  // For sentence/clause/tense practice, we test structure knowledge
  const sampleVerbs = ['is','are','was','were','has','have','had','will','can','does','did'];
  for(let i=0;i<20;i++){
    const level = i<7?'basic':i<14?'hard':'advance';
    let q, opts, answer;
    if(sentenceType==='simple'){
      if(level==='basic'){
        q = `Which is a correct ${type} simple sentence?`;
        const correct = type==='sentence' ? 'He is a doctor.' : type==='clause' ? 'She went to school.' : 'He plays cricket.';
        opts = shuffle([correct, 'He doctor a is.', 'Doctor he is a.']);
        answer = correct;
      } else if(level==='hard'){
        q = `Fill the blank: ${type==='sentence'?'He ___ a doctor.':type==='clause'?'She ___ to school.':'He ___ cricket.'}`;
        opts = shuffle(['is / went / plays','are / go / play','am / goes / playing']);
        answer = 'is / went / plays';
      } else {
        q = `Choose the correct subject-verb agreement for "${type}" simple sentence:`;
        opts = shuffle(['He plays.','He play.','He playing.']);
        answer = 'He plays.';
      }
    } else if(sentenceType==='neg'){
      if(level==='basic'){
        q = `Which is the correct negative form?`;
        opts = shuffle(['He is not a doctor.','He not is a doctor.','He is a doctor not.']);
        answer = 'He is not a doctor.';
      } else if(level==='hard'){
        q = `Fill the blank: He ___ not a doctor.`;
        opts = shuffle(['is','are','am']);
        answer = 'is';
      } else {
        q = `Choose the correct negative structure:`;
        opts = shuffle(['Subject + helping verb + not + main verb','Subject + not + helping verb + main verb','Not + subject + helping verb + main verb']);
        answer = 'Subject + helping verb + not + main verb';
      }
    } else {
      if(level==='basic'){
        q = `Which is a correct wh-question?`;
        opts = shuffle(['What is his profession?','What his profession is?','His profession is what?']);
        answer = 'What is his profession?';
      } else if(level==='hard'){
        q = `Fill the blank: ___ is his profession?`;
        opts = shuffle(['What','Where','Who']);
        answer = 'What';
      } else {
        q = `Choose the correct wh-question structure:`;
        opts = shuffle(['Wh-word + helping verb + subject + main verb','Wh-word + subject + helping verb + main verb','Helping verb + wh-word + subject + main verb']);
        answer = 'Wh-word + helping verb + subject + main verb';
      }
    }
    qs.push({q, options:opts, answer, level});
  }
  return qs;
}

function openPractice(cat,idx,type){
  let d;
  if(cat==='sentence') d = sentences[idx];
  else if(cat==='clause') d = clauses[idx];
  else if(cat==='tense') d = tenseGroups[S.sub2].types[idx];
  P = {cat, type, idx, data:d, title:d.title, questions:genQuestions(cat,type), current:0, level:'basic', answered:false, correctCount:0, selected:null};
  document.getElementById('modal').classList.add('open');
  document.getElementById('m-title').textContent = 'Practice: ' + d.title;
  document.getElementById('m-sub').textContent = type==='simple'?'Simple':type==='neg'?'Negative':'Wh-Question';
  renderPractice();
}

function closePractice(){document.getElementById('modal').classList.remove('open');P=null;}
function levelQuestions(level){return P.questions.filter(q=>q.level===level);}

function renderPractice(){
  const tabsEl = document.getElementById('m-tabs');
  while(tabsEl.firstChild) tabsEl.removeChild(tabsEl.firstChild);
  ['basic','hard','advance'].forEach(lv=>{
    const btn = document.createElement('button');
    btn.className = 'tab' + (P.level===lv?' active':'');
    btn.textContent = lv.charAt(0).toUpperCase()+lv.slice(1);
    btn.onclick = ()=>{P.level=lv;P.current=0;P.answered=false;P.selected=null;renderPractice();};
    tabsEl.appendChild(btn);
  });
  const qs = levelQuestions(P.level);
  const q = qs[P.current];
  if(!q){document.getElementById('m-q').textContent='No questions.';return;}
  document.getElementById('m-progress-text').textContent = `Question ${P.current+1} / ${qs.length}`;
  document.getElementById('m-score').textContent = `Score ${P.correctCount}`;
  document.getElementById('m-fill').style.width = `${(P.current/qs.length)*100}%`;
  document.getElementById('m-q').innerHTML = esc(q.q).replace(/___/g,'<span class="blank">___</span>');
  document.getElementById('m-correct').textContent = P.correctCount;
  document.getElementById('m-total').textContent = qs.length;
  const optsEl = document.getElementById('m-opts'); optsEl.innerHTML = '';
  const keys = ['A','B','C','D'];
  q.options.forEach((o,i)=>{
    const b = document.createElement('button');
    b.className = 'opt' + (P.answered?' disabled':'');
    b.innerHTML = `<span class="key">${keys[i]}</span><span>${esc(o)}</span>`;
    if(P.answered){
      if(o===q.answer) b.classList.add('correct');
      else if(o===P.selected) b.classList.add('wrong');
    }
    b.onclick = ()=>selectOpt(o);
    optsEl.appendChild(b);
  });
  const fb = document.getElementById('m-fb');
  fb.className='feedback'; fb.textContent='';
  if(P.answered){
    if(P.selected===q.answer){fb.className='feedback show ok';fb.textContent='✓ Correct!';}
    else {fb.className='feedback show bad';fb.textContent=`✗ Wrong. Correct: ${q.answer}`;}
  }
  document.getElementById('m-next').textContent = P.current >= qs.length-1 ? 'Finish' : 'Next →';
}

function selectOpt(opt){
  if(P.answered) return;
  const qs = levelQuestions(P.level); const q = qs[P.current];
  P.answered = true; P.selected = opt;
  if(opt===q.answer) P.correctCount++;
  renderPractice();
}

function nextQuestion(){
  const qs = levelQuestions(P.level);
  if(P.current >= qs.length-1){
    document.getElementById('m-q').innerHTML = `<div style="text-align:center;padding:20px 0"><div style="font-size:2.4rem;margin-bottom:12px">🎉</div><div style="font-size:1.2rem;font-weight:700;margin-bottom:8px">Level Complete!</div><div style="color:var(--text-muted)">Score: <b style="color:var(--purple-light)">${P.correctCount}</b> / ${qs.length}</div></div>`;
    document.getElementById('m-opts').innerHTML = '';
    document.getElementById('m-fb').className='feedback';
    document.getElementById('m-next').textContent = 'Close';
    document.getElementById('m-next').onclick = closePractice;
    return;
  }
  P.current++; P.answered=false; P.selected=null;
  document.getElementById('m-next').onclick = nextQuestion;
  renderPractice();
}

/* ============================================================
   SPOKEN ENGLISH CHAT
   ============================================================ */
let chatInitialized = false;
function initChat(){
  if(chatInitialized) return;
  chatInitialized = true;
  const box = document.getElementById('chat-box');
  if(!box) return;
  addBotMsg('Hello! 👋 Main aapki Spoken English practice me madad karunga. Neeche se koi phrase chuno ya type karo.', 'नमस्ते! नीचे से कोई वाक्यांश चुनें या टाइप करें।');
}

function addBotMsg(en, hi){
  const box = document.getElementById('chat-box');
  if(!box) return;
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = `${esc(en)}<span class="hi">${esc(hi)}</span>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function addUserMsg(text){
  const box = document.getElementById('chat-box');
  if(!box) return;
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function sendSpoken(quick){
  const input = document.getElementById('chat-in');
  const text = quick || (input ? input.value.trim() : '');
  if(!text) return;
  if(!quick && input) input.value = '';
  if(!document.getElementById('chat-box')) return;
  addUserMsg(text);
  const lower = text.toLowerCase();
  const found = spokenPhrases.find(p=>p.en.toLowerCase().includes(lower) || lower.includes(p.en.toLowerCase().split(' ')[0]));
  setTimeout(()=>{
    if(found){
      addBotMsg(found.en, found.hi);
    } else {
      addBotMsg('Good try! Try one of these:', 'अच्छी कोशिश! इनमें से कोई आज़माएं:');
      const sample = shuffle(spokenPhrases).slice(0,3);
      sample.forEach(p=>addBotMsg(p.en, p.hi));
    }
  }, 400);
}
