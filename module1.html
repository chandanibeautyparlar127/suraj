<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 1 — Grammar Basics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070913;--surface:#101425;--surface-2:#141a2e;--purple:#8b5cf6;--purple-light:#a78bfa;--blue:#3b82f6;--text:#f8fafc;--text-muted:#94a3b8;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.14);--grad:linear-gradient(135deg,#a78bfa,#8b5cf6,#3b82f6);--r:20px;--shadow:0 18px 50px -20px rgba(0,0,0,.85);--glow:0 0 0 1px rgba(139,92,246,.45),0 18px 60px -18px rgba(139,92,246,.55)}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:"Outfit",system-ui,sans-serif;line-height:1.6;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--purple),var(--blue));border-radius:999px;border:2px solid var(--bg)}
.mono{font-family:"Space Grotesk",monospace}
.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(120px)}
.orb-p{width:520px;height:520px;background:#8b5cf6;top:-160px;left:-120px;opacity:.4;animation:float 18s ease-in-out infinite}
.orb-b{width:560px;height:560px;background:#3b82f6;top:30%;right:-200px;opacity:.3;animation:float 22s ease-in-out infinite reverse}
.orb-v{width:460px;height:460px;background:#a78bfa;bottom:-180px;left:35%;opacity:.22;animation:float 26s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(40px,-50px,0) scale(1.12)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
.fade-up{opacity:0;animation:fadeUp .7s cubic-bezier(.22,1,.36,1) forwards}
.container{width:100%;max-width:1180px;margin-inline:auto;padding-inline:24px;position:relative;z-index:1}
header{position:sticky;top:0;z-index:100;background:rgba(10,13,26,.6);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--border)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;height:70px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);font-weight:700;font-size:1.05rem}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-family:"Space Grotesk",monospace;font-size:.9rem;font-weight:700;color:#fff}
.crumb{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--text-muted);flex-wrap:wrap}
.crumb a{color:var(--text-muted);text-decoration:none;transition:color .2s}
.crumb a:hover{color:var(--purple-light)}
.crumb .sep{opacity:.4}
.crumb .cur{color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:"Outfit",sans-serif;font-size:.88rem;font-weight:600;padding:10px 20px;border-radius:999px;border:1px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap;transition:all .25s}
.btn-primary{color:#fff;background:var(--grad);background-size:180% 180%;animation:gradShift 7s ease infinite;box-shadow:0 12px 34px -14px rgba(139,92,246,.95)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 18px 46px -14px rgba(139,92,246,1)}
.btn-ghost{color:var(--text);background:rgba(255,255,255,.03);border-color:var(--border-strong);backdrop-filter:blur(10px)}
.btn-ghost:hover{transform:translateY(-2px);border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.1)}
.btn-sm{padding:8px 16px;font-size:.82rem}
.page{padding:40px 0 100px;min-height:80vh}
.section-title{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-bottom:12px}
.section-sub{color:var(--text-muted);font-weight:300;margin-bottom:40px;max-width:620px}
.eyebrow{font-family:"Space Grotesk",monospace;font-size:.72rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:22px}
.card{position:relative;padding:28px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;transition:all .35s cubic-bezier(.22,1,.36,1);cursor:pointer}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);opacity:.7;transition:opacity .35s}
.card::after{content:"";position:absolute;top:-60%;left:50%;width:340px;height:340px;transform:translateX(-50%);background:radial-gradient(circle,rgba(139,92,246,.22),transparent 68%);opacity:0;transition:opacity .45s;pointer-events:none}
.card:hover{transform:translateY(-5px);border-color:rgba(139,92,246,.6);background:var(--surface-2);box-shadow:var(--glow),var(--shadow)}
.card:hover::before{opacity:0}
.card:hover::after{opacity:1}
.card-icon{position:relative;z-index:1;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:1.25rem;margin-bottom:20px;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.28);color:var(--purple-light);transition:all .35s}
.card:hover .card-icon{background:rgba(139,92,246,.2);border-color:rgba(167,139,250,.55);transform:translateY(-2px)}
.card h3{position:relative;z-index:1;font-size:1.1rem;font-weight:600;margin-bottom:8px;letter-spacing:-.01em}
.card p{position:relative;z-index:1;font-size:.9rem;font-weight:300;line-height:1.65;color:var(--text-muted)}
.card-tag{position:relative;z-index:1;display:inline-block;margin-top:16px;padding:5px 12px;border-radius:999px;border:1px solid var(--border);font-family:"Space Grotesk",monospace;font-size:.64rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
.verb-card{position:relative;padding:24px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:all .3s;text-align:center}
.verb-card:hover{transform:translateY(-5px);border-color:rgba(139,92,246,.6);background:var(--surface-2);box-shadow:var(--glow)}
.verb-card .v-word{font-size:1.3rem;font-weight:700;color:var(--text);margin-bottom:4px;letter-spacing:-.02em}
.verb-card .v-hi{font-size:.82rem;color:var(--text-muted);font-weight:300}
.detail{display:grid;gap:20px}
.hero-verb{padding:36px;border-radius:var(--r);background:linear-gradient(160deg,rgba(139,92,246,.14),rgba(59,130,246,.06)),var(--surface);border:1px solid rgba(139,92,246,.25);box-shadow:var(--shadow)}
.hero-verb .v-big{font-size:clamp(2rem,5vw,3rem);font-weight:800;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.hero-verb .v-meaning{font-size:1.1rem;color:var(--text);font-weight:500;margin-bottom:14px}
.hero-verb .v-use{font-size:.95rem;color:var(--text-muted);font-weight:300}
.hero-verb .v-use b{color:var(--purple-light);font-weight:600}
.rules-box{padding:26px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border)}
.rules-box h4{font-family:"Space Grotesk",monospace;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--purple-light);margin-bottom:14px}
.rules-box pre{font-family:"Space Grotesk",monospace;font-size:.86rem;color:var(--text);line-height:1.9;white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,.25);padding:16px;border-radius:12px;border:1px solid var(--border)}
.sent-card{padding:24px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:12px;transition:all .3s}
.sent-card:hover{border-color:rgba(139,92,246,.4);box-shadow:0 12px 40px -18px rgba(139,92,246,.5)}
.sent-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sent-label{font-family:"Space Grotesk",monospace;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted)}
.sent-text{font-size:1.05rem;font-weight:400;color:var(--text);line-height:1.5;padding:12px 16px;background:rgba(0,0,0,.25);border-radius:12px;border-left:3px solid var(--purple)}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);text-decoration:none;font-size:.88rem;margin-bottom:24px;transition:color .2s}
.back-link:hover{color:var(--purple-light)}
/* Practice modal */
.modal-overlay{position:fixed;inset:0;background:rgba(4,6,15,.85);backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;animation:fadeIn .3s ease}
.modal-overlay.open{display:flex}
.modal{width:100%;max-width:640px;max-height:92vh;overflow-y:auto;background:var(--surface);border:1px solid rgba(139,92,246,.35);border-radius:24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.9);animation:pop .35s cubic-bezier(.22,1,.36,1)}
.modal-head{padding:24px 28px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:sticky;top:0;background:var(--surface);z-index:2;border-radius:24px 24px 0 0}
.modal-head h3{font-size:1.1rem;font-weight:700;letter-spacing:-.01em}
.modal-head .sub{font-family:"Space Grotesk",monospace;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--purple-light);margin-top:4px}
.close-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:1.1rem;display:grid;place-items:center;transition:all .2s;flex-shrink:0}
.close-btn:hover{background:rgba(139,92,246,.2);border-color:rgba(139,92,246,.5)}
.modal-body{padding:24px 28px 28px}
.tabs{display:flex;gap:6px;margin-bottom:22px;background:rgba(0,0,0,.25);padding:5px;border-radius:999px}
.tab{flex:1;padding:9px;border-radius:999px;border:none;background:transparent;color:var(--text-muted);font-family:"Outfit",sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .25s}
.tab.active{background:var(--grad);color:#fff;box-shadow:0 8px 20px -8px rgba(139,92,246,.9)}
.tab:disabled{opacity:.4;cursor:not-allowed}
.progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-family:"Space Grotesk",monospace;font-size:.78rem;color:var(--text-muted)}
.progress-bar{height:6px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden;margin-bottom:22px}
.progress-fill{height:100%;background:var(--grad);border-radius:999px;transition:width .4s ease;width:0%}
.q-text{font-size:1.15rem;font-weight:500;line-height:1.6;margin-bottom:22px;padding:20px;background:rgba(0,0,0,.25);border-radius:14px;border-left:3px solid var(--purple)}
.q-text .blank{color:var(--purple-light);font-weight:700;letter-spacing:.1em}
.options{display:grid;gap:10px;margin-bottom:20px}
.opt{padding:14px 18px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--text);font-family:"Outfit",sans-serif;font-size:.98rem;font-weight:500;cursor:pointer;text-align:left;transition:all .2s;display:flex;align-items:center;gap:10px}
.opt:hover:not(.disabled){background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.45);transform:translateX(3px)}
.opt .key{font-family:"Space Grotesk",monospace;font-size:.72rem;width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,.06);display:grid;place-items:center;color:var(--text-muted)}
.opt.correct{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.6);color:#86efac}
.opt.wrong{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.6);color:#fca5a5}
.opt.disabled{cursor:not-allowed;opacity:.7}
.feedback{margin-top:14px;padding:12px 16px;border-radius:12px;font-size:.9rem;font-weight:500;display:none}
.feedback.show{display:block;animation:fadeIn .3s}
.feedback.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);color:#86efac}
.feedback.bad{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5}
.modal-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:16px;border-top:1px solid var(--border);margin-top:8px}
.score-chip{font-family:"Space Grotesk",monospace;font-size:.82rem;color:var(--text-muted)}
.score-chip b{color:var(--purple-light)}
.letters-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:12px}
.letter-btn{aspect-ratio:1;border-radius:16px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:"Space Grotesk",monospace;font-size:1.4rem;font-weight:700;cursor:pointer;transition:all .25s;display:grid;place-items:center;position:relative}
.letter-btn:hover{transform:translateY(-4px);border-color:rgba(139,92,246,.6);background:var(--surface-2);box-shadow:var(--glow)}
.letter-btn .cnt{position:absolute;bottom:6px;right:8px;font-size:.6rem;font-weight:500;color:var(--text-muted)}
.verb-row{display:grid;grid-template-columns:1.2fr 1fr 1fr 1.4fr;gap:12px;padding:14px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--border);margin-bottom:8px;align-items:center;font-size:.9rem;transition:all .2s}
.verb-row:hover{background:var(--surface-2);border-color:rgba(139,92,246,.35)}
.verb-row .v1{font-weight:700;color:var(--text)}
.verb-row .v2,.verb-row .v3{font-family:"Space Grotesk",monospace;font-size:.84rem;color:var(--purple-light)}
.verb-row .hi{font-size:.82rem;color:var(--text-muted);font-weight:300}
.row-head{display:grid;grid-template-columns:1.2fr 1fr 1fr 1.4fr;gap:12px;padding:0 18px;margin-bottom:8px;font-family:"Space Grotesk",monospace;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}
@media(max-width:600px){
  .verb-row,.row-head{grid-template-columns:1fr 1fr;gap:6px}
  .verb-row .hi{grid-column:1/-1}
  .modal-body{padding:20px}
  .modal-head{padding:20px}
}
</style>
</head>
<body>
<div class="orbs"><div class="orb orb-p"></div><div class="orb orb-b"></div><div class="orb orb-v"></div></div>

<header>
  <div class="container header-inner">
    <a href="index.html" class="logo"><span class="logo-mark">EG</span><span>Grammar Hub</span></a>
    <div class="crumb" id="crumb">
      <a href="index.html">Home</a><span class="sep">/</span>
      <a href="module1.html">Module 1</a>
    </div>
  </div>
</header>

<main class="page">
  <div class="container" id="app"></div>
</main>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-head">
      <div><h3 id="m-title">Practice</h3><div class="sub" id="m-sub">Basic</div></div>
      <button class="close-btn" onclick="closePractice()">×</button>
    </div>
    <div class="modal-body">
      <div class="tabs" id="m-tabs"></div>
      <div class="progress-row"><span id="m-progress-text">Question 1 / 7</span><span id="m-score">Score 0</span></div>
      <div class="progress-bar"><div class="progress-fill" id="m-fill"></div></div>
      <div class="q-text" id="m-q"></div>
      <div class="options" id="m-opts"></div>
      <div class="feedback" id="m-fb"></div>
      <div class="modal-foot">
        <span class="score-chip">Correct: <b id="m-correct">0</b> / <span id="m-total">7</span></span>
        <button class="btn btn-primary btn-sm" id="m-next" onclick="nextQuestion()">Next →</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   DATA — VERB TO BE (12 verbs)
   ============================================================ */
const verbToBe = [
{v:'is',hi:'है (वर्तमान, एकवचन)',use:'He, She, It, और एकवचन noun के साथ',subs:['He','She','It','Rohan','The cat','My father','This book','The sun'],comps:['a doctor','very happy','in the garden','a good student','at home','red','bright','my friend'],s:{simple:'He is a doctor.',neg:'He is not a doctor.',wh:'What is his profession?'},rules:'Structure: Subject + is + complement.\nNegative: Subject + is + not + complement.\nQuestion: Wh-word + is + subject + complement?'},
{v:'am',hi:'हूँ (वर्तमान, I के साथ)',use:'सिर्फ "I" के साथ',subs:['I'],comps:['a student','very happy','from India','ready','hungry','tired','excited','a teacher'],s:{simple:'I am a student.',neg:'I am not a student.',wh:'Who am I?'},rules:'Structure: I + am + complement.\nNegative: I + am + not + complement.\nQuestion: Wh-word + am + I + complement?'},
{v:'are',hi:'हैं (वर्तमान, बहुवचन)',use:'They, We, You, और बहुवचन noun के साथ',subs:['They','We','You','Rohan and Sita','The students','My friends','These books'],comps:['students','happy','in the class','good players','at home','ready','tired'],s:{simple:'They are students.',neg:'They are not students.',wh:'What are they?'},rules:'Structure: Subject + are + complement.\nNegative: Subject + are + not + complement.\nQuestion: Wh-word + are + subject + complement?'},
{v:'was',hi:'था/थी (past, एकवचन)',use:'He, She, It, I (singular) के साथ',subs:['He','She','It','I','Rohan','The dog','My mother'],comps:['a doctor','very happy','at home','a good boy','tired','late','sad'],s:{simple:'He was a doctor.',neg:'He was not a doctor.',wh:'What was his profession?'},rules:'Structure: Subject + was + complement.\nNegative: Subject + was + not + complement.\nQuestion: Wh-word + was + subject + complement?'},
{v:'were',hi:'थे/थीं (past, बहुवचन)',use:'They, We, You, और बहुवचन noun के साथ',subs:['They','We','You','The students','My friends','Rohan and Sita'],comps:['students','happy','in the class','late','ready','tired'],s:{simple:'They were students.',neg:'They were not students.',wh:'What were they?'},rules:'Structure: Subject + were + complement.\nNegative: Subject + were + not + complement.\nQuestion: Wh-word + were + subject + complement?'},
{v:'shall be',hi:'होगा/होंगे (future)',use:'I, We के साथ (formal British)',subs:['I','We'],comps:['a doctor','happy','there','ready','successful','at home'],s:{simple:'I shall be a doctor.',neg:'I shall not be a doctor.',wh:'What shall I be?'},rules:'Structure: Subject + shall be + complement.\nNegative: Subject + shall not be + complement.\nQuestion: Wh-word + shall + subject + be + complement?'},
{v:'will be',hi:'होगा/होंगे (future)',use:'सभी subjects के साथ',subs:['He','She','It','They','We','You','I'],comps:['a doctor','happy','there','ready','successful','at home'],s:{simple:'He will be a doctor.',neg:'He will not be a doctor.',wh:'What will he be?'},rules:'Structure: Subject + will be + complement.\nNegative: Subject + will not be + complement.\nQuestion: Wh-word + will + subject + be + complement?'},
{v:'has',hi:'के पास है / चुका है (perfect, singular)',use:'He, She, It, और एकवचन noun के साथ',subs:['He','She','It','Rohan','My father'],comps:['a car','finished the work','a beautiful house','eaten lunch','gone home'],s:{simple:'He has a car.',neg:'He has no car.',wh:'What does he have?'},rules:'Structure: Subject + has + object/complement.\nNegative: Subject + has + no + object OR has not + V3.\nQuestion: Wh-word + does + subject + have + object?'},
{v:'have',hi:'के पास है / चुका है (perfect, I/plural)',use:'I, We, They, You, और बहुवचन के साथ',subs:['I','We','They','You','My friends'],comps:['a car','finished the work','two children','eaten lunch','gone home'],s:{simple:'They have a car.',neg:'They have no car.',wh:'What do they have?'},rules:'Structure: Subject + have + object/complement.\nNegative: Subject + have + no + object OR have not + V3.\nQuestion: Wh-word + do + subject + have + object?'},
{v:'had',hi:'के पास था / चुका था (past perfect)',use:'सभी subjects के साथ',subs:['He','She','It','I','They','We','You'],comps:['a car','finished the work','a beautiful house','eaten lunch','gone home'],s:{simple:'He had a car.',neg:'He had no car.',wh:'What did he have?'},rules:'Structure: Subject + had + object/complement.\nNegative: Subject + had + no + object OR had not + V3.\nQuestion: Wh-word + did + subject + have + object?'},
{v:'shall have',hi:'होगा (future perfect)',use:'I, We के साथ',subs:['I','We'],comps:['a new phone','finished the work','a good job','reached there'],s:{simple:'I shall have a new phone.',neg:'I shall not have a new phone.',wh:'When shall I have a new phone?'},rules:'Structure: Subject + shall have + object.\nNegative: Subject + shall not have + object.\nQuestion: Wh-word + shall + subject + have + object?'},
{v:'will have',hi:'होगा (future perfect)',use:'सभी subjects के साथ',subs:['He','She','It','They','We','You','I'],comps:['a new phone','finished the work','a good job','reached there'],s:{simple:'He will have a new phone.',neg:'He will not have a new phone.',wh:'When will he have a new phone?'},rules:'Structure: Subject + will have + object.\nNegative: Subject + will not have + object.\nQuestion: Wh-word + will + subject + have + object?'}
];

/* ============================================================
   DATA — MODAL VERBS (10 verbs)

}

      <div class="card fade-up" style="animation-delay:${.05+i*.08}s" onclick="goCat('${k}')">
        <div class="card-icon mono">${c.icon}</div>
        <h3>${c.title}</h3>
        <p>${c.desc}</p>
        <span class="card-tag">${c.tag}</span>
      </div>`).join('')}
  </div>`;
}

function viewItems(){
  const c = CATS[S.cat];
  if(S.cat==='verbForms') return viewLetters();
  return `
  <a href="#" class="back-link" onclick="goHome();return false">← Back to Categories</a>
  <div class="fade-up"><span class="eyebrow">Module 1 / ${c.title}</span><h1 class="section-title" style="margin-top:10px">${c.title}</h1>
  <p class="section-sub">${c.desc}</p></div>
  <div class="grid">
    ${c.data.map((d,i)=>`
      <div class="verb-card fade-up" style="animation-delay:${.04+i*.05}s" onclick="goDetail('${S.cat}',${i})">
        <div class="v-word">${esc(d.v)}</div>
        <div class="v-hi">${esc(d.hi)}</div>
      </div>`).join('')}
  </div>`;
}

function viewDetail(){
  const c = CATS[S.cat];
  const d = c.data[S.item];
  return `
  <a href="#" class="back-link" onclick="goCat('${S.cat}');return false">← Back to ${c.title}</a>
  <div class="detail fade-up">
    <div class="hero-verb">
      <div class="v-big">${esc(d.v)}</div>
      <div class="v-meaning">${esc(d.hi)}</div>
      <div class="v-use"><b>Usage:</b> ${esc(d.use)}</div>
    </div>
    <div class="rules-box">
      <h4>Rules & Structure</h4>
      <pre>${esc(d.rules)}</pre>
    </div>
    ${['simple','neg','wh'].map((t,idx)=>{
      const labels = {simple:'1. Simple Sentence',neg:'2. Negative Sentence',wh:'3. Wh-Question'};
      return `<div class="sent-card">
        <div class="sent-head"><span class="sent-label">${labels[t]}</span>
          <button class="btn btn-primary btn-sm" onclick="openPractice('${S.cat}',${S.item},'${t}')">Practice ⚡</button>
        </div>
        <div class="sent-text">${esc(d.s[t])}</div>
      </div>`;
    }).join('')}
  </div>`;
}

function viewLetters(){
  const letters = Object.keys(verbForms).sort();
  return `
  <a href="#" class="back-link" onclick="goHome();return false">← Back to Categories</a>
  <div class="fade-up"><span class="eyebrow">Module 1 / Verb Forms</span><h1 class="section-title" style="margin-top:10px">Verb Forms A–Z</h1>
  <p class="section-sub">Pick a letter to see its verbs (V1, V2, V3) and practice game.</p></div>
  <div class="letters-grid fade-up">
    ${letters.map(L=>`<button class="letter-btn" onclick="goLetter('${L}')">${L}<span class="cnt mono">${verbForms[L].length}</span></button>`).join('')}
  </div>`;
}

function viewLetterVerbs(){
  const arr = verbForms[S.letter] || [];
  return `
  <a href="#" class="back-link" onclick="goLetters();return false">← Back to Letters</a>
  <div class="fade-up" style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px">
    <div><span class="eyebrow">Verb Forms / Letter ${S.letter}</span><h1 class="section-title" style="margin-top:10px">Verbs starting with ${S.letter}</h1></div>
    <button class="btn btn-primary" onclick="openLetterPractice('${S.letter}')">Practice ${S.letter} ⚡</button>
  </div>
  <div class="row-head"><span>V1</span><span>V2</span><span>V3</span><span>Hindi</span></div>
  ${arr.map(v=>`<div class="verb-row"><span class="v1">${esc(v.v1)}</span><span class="v2">${esc(v.v2)}</span><span class="v3">${esc(v.v3)}</span><span class="hi">${esc(v.hi)}</span></div>`).join('')}
  `;
}

function goHome(){S.view='home';S.cat=null;S.item=null;S.letter=null;render();}
function goCat(k){S.view='items';S.cat=k;S.item=null;S.letter=null;render();}
function goDetail(cat,i){S.view='detail';S.cat=cat;S.item=i;render();}
function goLetters(){S.view='letters';S.cat='verbForms';S.item=null;render();}
function goLetter(L){S.view='letterVerbs';S.cat='verbForms';S.letter=L;render();}

/* ============================================================
   PRACTICE ENGINE
   ============================================================ */
let P = null;

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function optsFor(v){
  const all = ['is','am','are','was','were','shall be','will be','has','have','had','shall have','will have'];
  if(['is','am','are'].includes(v)) return ['is','am','are'];
  if(['was','were'].includes(v)) return ['was','were'];
  if(['shall be','will be'].includes(v)) return ['shall be','will be'];
  if(['has','have','had'].includes(v)) return ['has','have','had'];
  if(['shall have','will have'].includes(v)) return ['shall have','will have'];
  return all;
}

function genVerbQuestions(data,type){
  const qs = [];
  const whs = ['What','Where','Why','Who','When','How'];
  const opts = optsFor(data.v);
  for(let i=0;i<20;i++){
    const subj = data.subs[i % data.subs.length];
    const comp = data.comps[i % data.comps.length];
    let q;
    if(type==='simple') q = `${subj} ___ ${comp}.`;
    else if(type==='neg') q = `${subj} ___ not ${comp}.`;
    else q = `${whs[i % whs.length]} ___ ${subj.toLowerCase()}?`;
    const level = i<7?'basic':i<14?'hard':'advance';
    let options;
    if(level==='basic'){
      const wrong = opts.find(x=>x!==data.v) || 'is';
      options = shuffle([data.v, wrong]);
    } else if(level==='hard'){
      const wrongs = opts.filter(x=>x!==data.v).slice(0,2);
      options = shuffle([data.v, ...wrongs]);
    } else {
      const wrongs = opts.filter(x=>x!==data.v).slice(0,3);
      options = shuffle([data.v, ...wrongs]);
    }
    qs.push({q, options, answer:data.v, level});
  }
  return qs;
}

function genModalQuestions(data,type){
  const qs = [];
  const whs = ['What','Where','Why','Who','When','How'];
  const allModals = ['can','may','should','could','must','will','shall','would','might','ought','need','dare','used to'];
  for(let i=0;i<20;i++){
    const subj = data.subs[i % data.subs.length];
    const comp = data.comps[i % data.comps.length];
    let q;
    if(type==='simple') q = `${subj} ___ ${comp}.`;
    else if(type==='neg') q = `${subj} ___ not ${comp}.`;
    else q = `${whs[i % whs.length]} ___ ${subj.toLowerCase()} ${comp}?`;
    const level = i<7?'basic':i<14?'hard':'advance';
    let wrongs;
    if(level==='basic'){
      const pool = allModals.filter(x=>x!==data.v);
      wrongs = shuffle(pool).slice(0,1);
    } else if(level==='hard'){
      const pool = allModals.filter(x=>x!==data.v);
      wrongs = shuffle(pool).slice(0,2);
    } else {
      const pool = allModals.filter(x=>x!==data.v);
      wrongs = shuffle(pool).slice(0,3);
    }
    qs.push({q, options:shuffle([data.v,...wrongs]), answer:data.v, level});
  }
  return qs;
}

function genLetterQuestions(letter){
  const arr = verbForms[letter] || [];
  if(arr.length===0) return [];
  const qs = [];
  for(let i=0;i<20;i++){
    const v = arr[i % arr.length];
    const askFor = i%2===0 ? 'v2' : 'v3';
    const correct = askFor==='v2' ? v.v2 : v.v3;
    const others = arr.filter(x=>x!==v).map(x=>askFor==='v2'?x.v2:x.v3);
    const level = i<7?'basic':i<14?'hard':'advance';
    const wrongs = shuffle(others).slice(0, level==='basic'?1:level==='hard'?2:3);
    qs.push({
      q: `<b>${esc(v.v1)}</b> <span style="color:var(--text-muted);font-size:.85em">(${esc(v.hi)})</span> का <b>${askFor.toUpperCase()}</b> क्या है?`,
      options: shuffle([correct, ...wrongs]),
      answer: correct,
      level
    });
  }
  return qs;
}

function openPractice(cat,idx,type){
  const data = CATS[cat].data[idx];
  P = {
    cat, type, idx,
    data,
    title: data.v,
    questions: cat==='verbToBe' ? genVerbQuestions(data,type) : genModalQuestions(data,type),
    current: 0, level:'basic', answered:false, correctCount:0, selected:null
  };
  showPracticeModal();
}

function openLetterPractice(letter){
  P = {
    cat:'verbForms', letter, type:'forms', data:{v:'Letter '+letter},
    title:'Letter '+letter,
    questions: genLetterQuestions(letter),
    current: 0, level:'basic', answered:false, correctCount:0, selected:null
  };
  showPracticeModal();
}

function showPracticeModal(){
  document.getElementById('modal').classList.add('open');
  document.getElementById('m-title').textContent = 'Practice: ' + P.title;
  document.getElementById('m-sub').textContent = P.cat==='verbToBe' ? 'Verb to Be' : P.cat==='modal' ? 'Modal Verb' : P.cat==='semiModal' ? 'Semi Modal' : 'Verb Forms';
  renderPractice();
}

function closePractice(){
  document.getElementById('modal').classList.remove('open');
  P = null;
}

function levelQuestions(level){
  return P.questions.filter(q=>q.level===level);
}

function renderPractice(){
  const tabsEl = document.getElementById('m-tabs');
  ['basic','hard','advance'].forEach(lv=>{
    const btn = document.createElement('button');
    btn.className = 'tab' + (P.level===lv?' active':'');
    btn.textContent = lv.charAt(0).toUpperCase()+lv.slice(1);
    btn.onclick = ()=>{ P.level=lv; P.current=0; P.answered=false; P.selected=null; renderPractice(); };
    tabsEl.appendChild(btn);
  });
  // clear old tabs first
  while(tabsEl.firstChild) tabsEl.removeChild(tabsEl.firstChild);
  ['basic','hard','advance'].forEach(lv=>{
    const btn = document.createElement('button');
    btn.className = 'tab' + (P.level===lv?' active':'');
    btn.textContent = lv.charAt(0).toUpperCase()+lv.slice(1);
    btn.onclick = ()=>{ P.level=lv; P.current=0; P.answered=false; P.selected=null; renderPractice(); };
    tabsEl.appendChild(btn);
  });

  const qs = levelQuestions(P.level);
  const q = qs[P.current];
  if(!q){ document.getElementById('m-q').textContent = 'No questions for this level.'; return; }

  document.getElementById('m-progress-text').textContent = `Question ${P.current+1} / ${qs.length}`;
  document.getElementById('m-score').textContent = `Score ${P.correctCount}`;
  document.getElementById('m-fill').style.width = `${((P.current)/qs.length)*100}%`;
  document.getElementById('m-q').innerHTML = q.q.replace(/___/g,'<span class="blank">___</span>');
  document.getElementById('m-correct').textContent = P.correctCount;
  document.getElementById('m-total').textContent = qs.length;

  const optsEl = document.getElementById('m-opts');
  optsEl.innerHTML = '';
  const keys = ['A','B','C','D'];
  q.options.forEach((o,i)=>{
    const b = document.createElement('button');
    b.className = 'opt' + (P.answered?' disabled':'');
    b.innerHTML = `<span class="key">${keys[i]}</span><span>${esc(o)}</span>`;
    if(P.answered){
      if(o===q.answer) b.classList.add('correct');
      else if(o===P.selected) b.classList.add('wrong');
    }
    b.onclick = ()=>selectOpt(o);
    optsEl.appendChild(b);
  });

  const fb = document.getElementById('m-fb');
  fb.className = 'feedback';
  fb.textContent = '';
  if(P.answered){
    if(P.selected===q.answer){ fb.className='feedback show ok'; fb.textContent='✓ Correct!'; }
    else { fb.className='feedback show bad'; fb.textContent=`✗ Wrong. Correct answer: ${q.answer}`; }
  }

  document.getElementById('m-next').textContent = P.current >= qs.length-1 ? 'Finish' : 'Next →';
}

function selectOpt(opt){
  if(P.answered) return;
  const qs = levelQuestions(P.level);
  const q = qs[P.current];
  P.answered = true;
  P.selected = opt;
  if(opt === q.answer) P.correctCount++;
  renderPractice();
}

function nextQuestion(){
  const qs = levelQuestions(P.level);
  if(P.current >= qs.length-1){
    // finished this level
    document.getElementById('m-q').innerHTML = `<div style="text-align:center;padding:20px 0"><div style="font-size:2.4rem;margin-bottom:12px">🎉</div><div style="font-size:1.2rem;font-weight:700;margin-bottom:8px">Level Complete!</div><div style="color:var(--text-muted)">You scored <b style="color:var(--purple-light)">${P.correctCount}</b> out of ${qs.length}</div></div>`;
    document.getElementById('m-opts').innerHTML = '';
    document.getElementById('m-fb').className = 'feedback';
    document.getElementById('m-next').textContent = 'Close';
    document.getElementById('m-next').onclick = closePractice;
    return;
  }
  P.current++;
  P.answered = false;
  P.selected = null;
  document.getElementById('m-next').onclick = nextQuestion;
  renderPractice();
}

/* ============================================================
   INIT
   ============================================================ */
render();
</script>
