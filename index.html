<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>English Mastery — Learn & Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #070913; --bg-card: #101425; --bg-hover: #181e36; --bg-inner: #0a0d1a;
  --purple: #8b5cf6; --purple-l: #a78bfa; --blue: #3b82f6; --green: #10b981;
  --green-bg: rgba(16, 185, 129, 0.12); --red: #ef4444; --red-bg: rgba(239, 68, 68, 0.12);
  --yellow: #f59e0b; --text: #f8fafc; --muted: #94a3b8; --border: rgba(255, 255, 255, 0.08);
  --border-glow: rgba(139, 92, 246, 0.35); --grad: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 40%, #3b82f6 100%);
  --font: "Outfit", sans-serif; --mono: "Space Grotesk", monospace; --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; line-height: 1.6; }
button, input { font-family: inherit; color: inherit; border: none; outline: none; background: none; cursor: pointer; }
::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: var(--bg); } ::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 8px; }

/* Background orbs */
.bg-orb { position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0; opacity: 0.4; }
.bg-orb-1 { width: 500px; height: 500px; background: #8b5cf6; top: -150px; left: -150px; }
.bg-orb-2 { width: 600px; height: 600px; background: #3b82f6; bottom: -200px; right: -200px; opacity: 0.3; }

/* Screens */
.screen { display: none; min-height: 100vh; position: relative; z-index: 1; }
.screen.active { display: block; animation: fadeUp 0.5s var(--ease); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

/* Header */
.hdr { padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; background: rgba(7, 9, 19, 0.85); backdrop-filter: blur(20px); }
.hdr-brand { font-family: var(--mono); font-size: 18px; font-weight: 800; letter-spacing: 1px; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 8px; }
.hdr-brand::before { content: "📘"; font-size: 20px; -webkit-text-fill-color: initial; }
.hdr-stats { display: flex; gap: 8px; align-items: center; }
.stat-pill { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border); border-radius: 999px; font-size: 12.5px; font-weight: 600; font-family: var(--mono); white-space: nowrap; }
.stat-pill.xp { color: var(--purple-l); border-color: rgba(139, 92, 246, 0.3); background: rgba(139, 92, 246, 0.08); }
.btn-back { padding: 8px 16px; border-radius: 10px; background: var(--bg-card); border: 1px solid var(--border); font-weight: 600; font-size: 14px; transition: 0.2s; }
.btn-back:hover { background: var(--bg-hover); border-color: var(--purple); }

/* Wrappers */
.wrap { max-width: 960px; margin: 0 auto; padding: 24px 20px 80px; }

/* Hero */
.hero { background: linear-gradient(145deg, rgba(139, 92, 246, 0.12), rgba(59, 130, 246, 0.06), rgba(16, 20, 37, 0.9)); border: 1px solid var(--border-glow); border-radius: 24px; padding: 32px 28px; margin-bottom: 28px; position: relative; overflow: hidden; }
.hero-emoji { font-size: 40px; margin-bottom: 6px; }
.hero-title { font-size: 28px; font-weight: 800; line-height: 1.2; margin-bottom: 6px; position: relative; }
.hero-title .grad { background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.hero-sub { color: var(--muted); font-size: 14.5px; margin-bottom: 20px; }

/* Section title */
.section-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
.section-title::before { content: ""; width: 4px; height: 22px; background: var(--grad); border-radius: 4px; }

/* Grid & Cards */
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.grid-verbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-bottom: 24px; }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 26px; cursor: pointer; transition: 0.3s var(--ease); position: relative; overflow: hidden; }
.card:hover { transform: translateY(-5px); border-color: var(--border-glow); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(139, 92, 246, 0.15); }
.card-icon { font-size: 34px; margin-bottom: 14px; }
.card-title { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
.card-desc { font-size: 13.5px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }

/* Verb Buttons */
.verb-btn { padding: 18px 12px; background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 14px; text-align: center; font-weight: 800; font-size: 18px; color: var(--yellow); transition: 0.2s var(--ease); font-family: var(--mono); letter-spacing: 1px; }
.verb-btn:hover { background: var(--bg-hover); border-color: var(--yellow); transform: translateY(-3px); }
.verb-btn.active { background: var(--grad); color: white; border-color: transparent; box-shadow: 0 8px 24px rgba(139, 92, 246, 0.4); }

/* Details Section */
.usage-box { background: rgba(139, 92, 246, 0.1); border: 1px solid rgba(139, 92, 246, 0.3); padding: 15px 20px; border-radius: 12px; margin-bottom: 24px; color: var(--purple-l); font-weight: 600; }
.ex-section { margin-bottom: 24px; border-radius: 14px; border: 1px solid var(--border); background: var(--bg-card); overflow: hidden; }
.ex-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); }
.ex-title { font-size: 15px; font-weight: 700; }
.play-btn { padding: 8px 18px; background: linear-gradient(135deg, var(--green), #059669); border-radius: 20px; font-weight: 700; font-size: 12.5px; display: flex; align-items: center; gap: 6px; transition: 0.2s; color: white;}
.play-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4); }
.ex-list { padding: 14px; max-height: 400px; overflow-y: auto; background: var(--bg-inner); }
.ex-item { background: var(--bg-card); padding: 14px 16px; border-radius: 10px; margin-bottom: 10px; border-left: 3px solid var(--blue); }
.ex-en { font-size: 15px; font-weight: 600; margin-bottom: 3px; color: var(--text); }
.ex-hi { font-size: 13px; color: var(--muted); }

/* Game / Practice Container */
.game-container { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 28px 24px; margin-top: 20px; }
.game-hdr { display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 12.5px; color: var(--muted); margin-bottom: 20px; }
.game-progress-bar { height: 8px; background: rgba(255, 255, 255, 0.06); border-radius: 8px; overflow: hidden; margin-bottom: 24px; }
.game-progress-fill { height: 100%; background: var(--grad); border-radius: 8px; transition: width 0.5s var(--ease); }
.q-prompt { font-size: 13px; font-family: var(--mono); text-transform: uppercase; color: var(--purple-l); margin-bottom: 10px; }
.q-subtitle { font-size: 20px; font-weight: 700; color: var(--yellow); margin-bottom: 24px; }
.mcq-btn { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px 20px; background: var(--bg-inner); border: 1.5px solid var(--border); border-radius: 12px; margin-bottom: 10px; text-align: left; font-size: 15px; font-weight: 500; transition: 0.2s var(--ease); }
.mcq-btn:hover:not(:disabled) { border-color: var(--purple); background: var(--bg-hover); transform: translateX(4px); }
.mcq-key { width: 28px; height: 28px; border-radius: 8px; background: rgba(139, 92, 246, 0.15); border: 1px solid rgba(139, 92, 246, 0.3); display: grid; place-items: center; font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--purple-l); flex-shrink: 0; }
.mcq-btn.correct { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.mcq-btn.correct .mcq-key { background: rgba(16, 185, 129, 0.25); border-color: var(--green); color: var(--green); }
.mcq-btn.wrong { background: var(--red-bg); border-color: var(--red); color: var(--red); }
.mcq-btn.wrong .mcq-key { background: rgba(239, 68, 68, 0.25); border-color: var(--red); color: var(--red); }

/* Result */
.result-wrap { text-align: center; padding: 30px 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; }
.result-emoji { font-size: 72px; margin-bottom: 12px; }
.result-title { font-size: 30px; font-weight: 800; margin-bottom: 6px; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.result-sub { color: var(--muted); font-size: 15px; margin-bottom: 24px; }
.btn-primary { padding: 13px 32px; background: var(--grad); border-radius: 30px; font-weight: 700; font-size: 14px; color: white; transition: 0.2s; }
.btn-primary:hover { transform: translateY(-2px); }
.btn-secondary { padding: 13px 32px; background: transparent; border: 1.5px solid var(--border); border-radius: 30px; font-weight: 700; font-size: 14px; color: var(--text); }
.btn-secondary:hover { background: var(--bg-hover); border-color: var(--purple); }

/* Toast */
.toast { position: fixed; top: 80px; left: 50%; transform: translate(-50%, -120px); padding: 14px 26px; border-radius: 30px; font-weight: 700; font-size: 14px; opacity: 0; transition: 0.4s var(--ease); z-index: 9999; pointer-events: none; }
.toast.show { transform: translate(-50%, 0); opacity: 1; }
.toast.success { background: var(--green); color: white; }
.toast.error { background: var(--red); color: white; }
</style>
</head>
<body>

<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>

<!-- HOME SCREEN -->
<div class="screen active" id="screen-home">
  <header class="hdr">
    <div class="hdr-brand">ENGLISH MASTERY</div>
    <div class="hdr-stats">
      <div class="stat-pill xp"><span>⚡</span><span id="hdrXP">0</span> XP</div>
    </div>
  </header>
  <div class="wrap">
    <div class="hero">
      <div class="hero-emoji">👋</div>
      <h1 class="hero-title">Welcome to <span class="grad">English Mastery!</span></h1>
      <p class="hero-sub">Select a module below to start learning and practicing.</p>
    </div>
    <h2 class="section-title">Your Modules</h2>
    <div class="grid-3" id="modulesGrid"></div>
  </div>
</div>

<!-- SUB-MODULE SCREEN -->
<div class="screen" id="screen-submodule">
  <header class="hdr">
    <button class="btn-back" onclick="goHome()">← Back</button>
    <div class="hdr-stats"><div class="stat-pill xp"><span>⚡</span><span id="subXP">0</span> XP</div></div>
  </header>
  <div class="wrap">
    <div class="hero" style="padding: 20px 24px; margin-bottom: 20px;">
      <h1 class="hero-title" id="subTitle">Title</h1>
      <p class="hero-sub" id="subDesc">Description</p>
    </div>
    <div class="grid-3" id="subGrid"></div>
  </div>
</div>

<!-- LESSON / VERB SCREEN -->
<div class="screen" id="screen-lesson">
  <header class="hdr">
    <button class="btn-back" onclick="goBackToSub()">← Back</button>
    <div class="hdr-stats"><div class="stat-pill xp"><span>⚡</span><span id="lesXP">0</span> XP</div></div>
  </header>
  <div class="wrap">
    <div class="grid-verbs" id="verbGrid" style="display:none;"></div>
    
    <div class="lesson-head">
      <h1 class="hero-title" id="lesTitle" style="font-size: 24px;">Verb Name</h1>
      <p class="hero-sub" id="lesSub">Meaning</p>
    </div>
    <div id="lessonBody"></div>
  </div>
</div>

<!-- GAME SCREEN -->
<div class="screen" id="screen-game">
  <header class="hdr">
    <button class="btn-back" onclick="quitGame()">← Back</button>
    <div class="hdr-stats"><div class="stat-pill xp"><span>⚡</span><span id="gameXP">0</span> XP</div></div>
  </header>
  <div class="wrap" id="gameBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==========================================================
   ALL DATA (Module 1 & 2)
   ========================================================== */
const module1 = {
  id: 'm1', title: 'Module 1: Verbs', desc: 'Learn all types of verbs with examples and practice.', icon: '📗',
  items: [
    {
      id: 'v-to-be', title: 'Verb To Be', desc: 'is, am, are, was, were, shall be, etc.', icon: '🌱', type: 'verb',
      verbs: [
        { word: 'is', meaning: 'है (hai) - Used with He, She, It', usage: 'Use "is" with singular subjects like He, She, It, or singular nouns.', structure: 'Simple: He/She/It + is + ...\nNegative: He/She/It + is + not + ...\nWH: WH + is + Subject + ...',
          examples: {
            simple: [ { en: 'She is my sister.', hi: 'वह मेरी बहन है।' }, { en: 'He is a doctor.', hi: 'वह डॉक्टर है।' }, { en: 'It is cold today.', hi: 'आज ठंड है।' } ],
            negative: [ { en: 'She is not here.', hi: 'वह यहाँ नहीं है।' }, { en: 'He is not tired.', hi: 'वह थका नहीं है।' }, { en: 'It is not ready.', hi: 'यह तैयार नहीं है।' } ],
            wh: [ { en: 'Where is she?', hi: 'वह कहाँ है?' }, { en: 'Who is he?', hi: 'वह कौन है?' }, { en: 'Why is it late?', hi: 'देर क्यों है?' } ]
          }
        },
        { word: 'am', meaning: 'हूँ (hūn) - Used with I', usage: 'Use "am" only with the subject "I" in present tense.', structure: 'Simple: I + am + ...\nNegative: I + am + not + ...\nWH: WH + am + I + ...',
          examples: {
            simple: [ { en: 'I am happy.', hi: 'मैं खुश हूँ।' }, { en: 'I am a student.', hi: 'मैं एक छात्र हूँ।' }, { en: 'I am ready.', hi: 'मैं तैयार हूँ।' } ],
            negative: [ { en: 'I am not busy.', hi: 'मैं व्यस्त नहीं हूँ।' }, { en: 'I am not angry.', hi: 'मैं गुस्से में नहीं हूँ।' }, { en: 'I am not late.', hi: 'मैं देर से नहीं हूँ।' } ],
            wh: [ { en: 'Why am I here?', hi: 'मैं यहाँ क्यों हूँ?' }, { en: 'Where am I?', hi: 'मैं कहाँ हूँ?' }, { en: 'Who am I?', hi: 'मैं कौन हूँ?' } ]
          }
        },
        { word: 'are', meaning: 'हैं (hain) - Used with You, We, They', usage: 'Use "are" with plural subjects like We, They, You.', structure: 'Simple: We/They/You + are + ...\nNegative: We/They/You + are + not + ...',
          examples: {
            simple: [ { en: 'We are friends.', hi: 'हम दोस्त हैं।' }, { en: 'They are students.', hi: 'वे छात्र हैं।' }, { en: 'You are kind.', hi: 'तुम दयालु हो।' } ],
            negative: [ { en: 'We are not late.', hi: 'हम देर से नहीं हैं।' }, { en: 'They are not here.', hi: 'वे यहाँ नहीं हैं।' }, { en: 'You are not wrong.', hi: 'तुम गलत नहीं हो।' } ],
            wh: [ { en: 'Where are they?', hi: 'वे कहाँ हैं?' }, { en: 'Who are you?', hi: 'तुम कौन हो?' }, { en: 'What are we doing?', hi: 'हम क्या कर रहे हैं?' } ]
          }
        },
        { word: 'was', meaning: 'था / थी (tha / thi) - Past singular', usage: 'Past tense of "is/am". Used with I, He, She, It.', structure: 'Simple: I/He/She/It + was + ...\nNegative: I/He/She/It + was + not + ...',
          examples: {
            simple: [ { en: 'She was happy.', hi: 'वह खुश थी।' }, { en: 'I was tired.', hi: 'मैं थका हुआ था।' }, { en: 'It was cold.', hi: 'ठंड थी।' } ],
            negative: [ { en: 'He was not here.', hi: 'वह यहाँ नहीं था।' }, { en: 'It was not easy.', hi: 'यह आसान नहीं था।' }, { en: 'I was not ready.', hi: 'मैं तैयार नहीं था।' } ],
            wh: [ { en: 'Where was she?', hi: 'वह कहाँ थी?' }, { en: 'Why was it late?', hi: 'देर क्यों थी?' }, { en: 'Who was that?', hi: 'वह कौन था?' } ]
          }
        },
        { word: 'were', meaning: 'थे / थीं (the / thin) - Past plural', usage: 'Past tense of "are". Used with We, They, You.', structure: 'Simple: We/They/You + were + ...\nNegative: We/They/You + were + not + ...',
          examples: {
            simple: [ { en: 'They were friends.', hi: 'वे दोस्त थे।' }, { en: 'We were young.', hi: 'हम जवान थे।' }, { en: 'You were right.', hi: 'तुम सही थे।' } ],
            negative: [ { en: 'They were not late.', hi: 'वे देर से नहीं थे।' }, { en: 'We were not ready.', hi: 'हम तैयार नहीं थे।' }, { en: 'You were not wrong.', hi: 'तुम गलत नहीं थे।' } ],
            wh: [ { en: 'Where were they?', hi: 'वे कहाँ थे?' }, { en: 'Why were you angry?', hi: 'तुम गुस्से में क्यों थे?' }, { en: 'Who were they?', hi: 'वे कौन थे?' } ]
          }
        },
        { word: 'shall be', meaning: 'होगा (hoga) - Future', usage: 'Future tense. Used with I, We usually.', structure: 'Simple: I/We + shall be + ...\nNegative: I/We + shall not be + ...',
          examples: {
            simple: [ { en: 'I shall be there.', hi: 'मैं वहाँ रहूँगा।' }, { en: 'We shall be late.', hi: 'हम देर से होंगे।' }, { en: 'I shall be happy.', hi: 'मैं खुश रहूँगा।' } ],
            negative: [ { en: 'I shall not be late.', hi: 'मैं देर नहीं करूँगा।' }, { en: 'We shall not be there.', hi: 'हम वहाँ नहीं होंगे।' }, { en: 'I shall not be angry.', hi: 'मैं गुस्सा नहीं होऊँगा।' } ],
            wh: [ { en: 'Where shall I be?', hi: 'मैं कहाँ रहूँगा?' }, { en: 'Why shall we be late?', hi: 'हम देर क्यों होंगे?' }, { en: 'How shall I be ready?', hi: 'मैं कैसे तैयार होऊँगा?' } ]
          }
        },
        { word: 'will be', meaning: 'होगा (hoga) - Future', usage: 'Future tense. Used with He, She, It, You, They.', structure: 'Simple: Subject + will be + ...\nNegative: Subject + will not be + ...',

            negative: [ { en: 'He will not be here.', hi: 'वह यहाँ नहीं होगा।' }, { en: 'They will not be late.', hi: 'वे देर से नहीं होंगे।' }, { en: 'She will not be angry.', hi: 'वह गुस्सा नहीं होगी।' } ],
            wh: [ { en: 'Where will he be?', hi: 'वह कहाँ होगा?' }, { en: 'Why will they be late?', hi: 'वे देर क्यों होंगे?' }, { en: 'When will she be ready?', hi: 'वह कब तैयार होगी?' } ]
          }
        },
        { word: 'has', meaning: 'पास है (paas hai) - Present singular', usage: 'Shows possession. Used with He, She, It.', structure: 'Simple: He/She/It + has + ...\nNegative: He/She/It + does not have + ...',
          examples: {
            simple: [ { en: 'He has a car.', hi: 'उसके पास एक कार है।' }, { en: 'She has a pen.', hi: 'उसके पास एक कलम है।' }, { en: 'It has a tail.', hi: 'इसकी एक पूंछ है।' } ],

            wh: [ { en: 'What does he have?', hi: 'उसके पास क्या है?' }, { en: 'Why does she have a pen?', hi: 'उसके पास कलम क्यों है?' }, { en: 'Who has a car?', hi: 'किसके पास कार है?' } ]
          }
        },
        { word: 'have', meaning: 'पास है (paas hai) - Present plural', usage: 'Shows possession. Used with I, You, We, They.', structure: 'Simple: I/You/We/They + have + ...\nNegative: I/You/We/They + do not have + ...',

   ========================================================== */
let state = { xp: parseInt(localStorage.getItem('eng_xp')) || 0 };
let currentModule = null;
let currentSub = null;
let currentVerbIndex = 0;
let gameState = null;

function $(id) { return document.getElementById(id); }
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0, 0);
}
function updateXP() {
  $('hdrXP').textContent = state.xp; $('subXP').textContent = state.xp;
  $('lesXP').textContent = state.xp; $('gameXP').textContent = state.xp;
  localStorage.setItem('eng_xp', state.xp);
}
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let toastTimer;
function showToast(msg, type = 'success') {
  const t = $('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

function renderHome() {
  updateXP();
  $('modulesGrid').innerHTML = MODULES.map(mod => `
    <div class="card" onclick="openModule('${mod.id}')">
      <div class="card-icon">${mod.icon || '📚'}</div>
      <div class="card-title">${mod.title}</div>
      <div class="card-desc">${mod.desc}</div>
    </div>
  `).join('');
}

function goHome() { showScreen('screen-home'); renderHome(); }

function openModule(modId) {
  currentModule = MODULES.find(m => m.id === modId);
  $('subTitle').textContent = currentModule.title;
  $('subDesc').textContent = currentModule.desc;
  $('subGrid').innerHTML = currentModule.items.map((item, i) => `
    <div class="card" onclick="openSubItem(${i})">
      <div class="card-icon">${item.icon || '📄'}</div>
      <div class="card-title">${item.title}</div>
      <div class="card-desc">${item.desc || ''}</div>
    </div>
  `).join('');
  showScreen('screen-submodule');
}

function openSubItem(index) {
  currentSub = currentModule.items[index];
  
  if (currentSub.type === 'verb') {
    $('verbGrid').style.display = 'grid';
    $('verbGrid').innerHTML = currentSub.verbs.map((v, i) => `
      <button class="verb-btn ${i===0?'active':''}" onclick="pickVerb(${i})">${v.word.toUpperCase()}</button>
    `).join('');
    currentVerbIndex = 0;
    loadVerbDetails();
  } else {
    $('verbGrid').style.display = 'none';
    $('lesTitle').textContent = currentSub.title;
    $('lesSub').textContent = currentSub.desc || '';
    renderStandardLessonBody(currentSub);
  }
  showScreen('screen-lesson');
}

function pickVerb(i) {
  document.querySelectorAll('.verb-btn').forEach((b, idx) => b.classList.toggle('active', idx === i));
  currentVerbIndex = i;
  loadVerbDetails();
}

function loadVerbDetails() {
  const verb = currentSub.verbs[currentVerbIndex];
  $('lesTitle').textContent = verb.word.toUpperCase();
  $('lesSub').textContent = verb.meaning;
  
  let html = `<div class="usage-box"><strong>Rule / Usage:</strong> ${verb.usage || 'Use as per subject.'}</div>`;
  if (verb.structure) {
    html += `<div class="usage-box" style="background:var(--bg-inner); border-color:var(--border); color:var(--yellow); font-family:var(--mono);"><strong>Structure:</strong><br>${verb.structure.replace(/\n/g, '<br>')}</div>`;
  }

  const createSection = (title, key, color) => {
    if (!verb.examples || !verb.examples[key] || verb.examples[key].length === 0) return '';
    return `
      <div class="ex-section">
        <div class="ex-header">
          <div class="ex-title" style="color:${color}">${title}</div>
          <button class="play-btn" onclick="startGame('${key}')">🎮 Practice</button>
        </div>
        <div class="ex-list">
          ${verb.examples[key].map(ex => `<div class="ex-item" style="border-left-color:${color}"><div class="ex-en">${ex.en}</div><div class="ex-hi">${ex.hi}</div></div>`).join('')}
        </div>
      </div>
    `;
  };

  html += createSection('Simple Sentences', 'simple', 'var(--green)');
  html += createSection('Negative Sentences', 'negative', 'var(--red)');
  html += createSection('WH Questions', 'wh', 'var(--blue)');

  $('lessonBody').innerHTML = html;
}

function renderStandardLessonBody(item) {
  let html = '';
  if(item.definition) html += `<div class="usage-box">${item.definition}</div>`;
  if(item.rule) html += `<div class="usage-box" style="background:var(--bg-inner); border-color:var(--border); color:var(--yellow);"><strong>Rule / Structure:</strong><br>${item.rule}</div>`;
  
  if (item.examples) {
    const createSection = (title, key, color) => {
      if (!item.examples[key] || item.examples[key].length === 0) return '';
      return `
        <div class="ex-section">
          <div class="ex-header">
            <div class="ex-title" style="color:${color}">${title}</div>
            <button class="play-btn" onclick="startGame('${key}')">🎮 Practice</button>
          </div>
          <div class="ex-list">
            ${item.examples[key].map(ex => `<div class="ex-item" style="border-left-color:${color}"><div class="ex-en">${ex.en}</div><div class="ex-hi">${ex.hi}</div></div>`).join('')}
          </div>
        </div>
      `;
    };
    html += createSection('Simple Sentences', 'simple', 'var(--green)');
    html += createSection('Negative Sentences', 'negative', 'var(--red)');
    html += createSection('WH Questions', 'wh', 'var(--blue)');
  }
  $('lessonBody').innerHTML = html;
}

function goBackToSub() { openModule(currentModule.id); }

function startGame(sectionKey) {
  let data = currentSub.type === 'verb' ? currentSub.verbs[currentVerbIndex] : currentSub;
  let examples = data.examples[sectionKey];
  if(!examples || examples.length === 0) return showToast('No examples to practice!', 'error');
  
  let pool = [...examples];
  while (pool.length < 20) { pool = pool.concat(examples); }
  pool = pool.slice(0, 20);

  let questions = shuffle(pool).map(ex => {
    const isHard = Math.random() > 0.5;
    if (isHard) {
      let wrongOpts = shuffle(examples.filter(e => e.en !== ex.en)).slice(0, 3);
      while(wrongOpts.length < 3) wrongOpts.push({en: "None of these"});
      let opts = shuffle([ex.en, ...wrongOpts.map(w => w.en)]);
      return { q: ex.hi, opts: opts, correct: opts.indexOf(ex.en) };
    } else {
      let wrongOpts = shuffle(examples.filter(e => e.hi !== ex.hi)).slice(0, 3);
      while(wrongOpts.length < 3) wrongOpts.push({hi: "इनमें से कोई नहीं"});
      let opts = shuffle([ex.hi, ...wrongOpts.map(w => w.hi)]);
      return { q: ex.en, opts: opts, correct: opts.indexOf(ex.hi) };
    }
  });

  gameState = { questions, index: 0, correct: 0, total: questions.length, sectionKey };
  showScreen('screen-game');
  renderGame();
}

function renderGame() {
  let gs = gameState;
  if (gs.index >= gs.total) return showResult();
  let q = gs.questions[gs.index];
  let pct = (gs.index / gs.total) * 100;

  $('gameBody').innerHTML = `
    <div class="game-container">
      <div class="game-progress-bar"><div class="game-progress-fill" style="width:${pct}%"></div></div>
      <div class="game-hdr"><span>Question ${gs.index + 1} of ${gs.total}</span><span>Score: ${gs.correct}</span></div>
      <div class="q-prompt">Translate this:</div>
      <div class="q-subtitle">${q.q}</div>
      <div id="mcqOptions">
        ${q.opts.map((opt, i) => `
          <button class="mcq-btn" onclick="answerMCQ(${i})">
            <span class="mcq-key">${String.fromCharCode(65 + i)}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
    </div>
  `;
}

function answerMCQ(i) {
  let gs = gameState;
  let q = gs.questions[gs.index];
  let btns = document.querySelectorAll('.mcq-btn');
  btns.forEach(b => b.disabled = true);
  
  if (i === q.correct) {
    btns[i].classList.add('correct');
    showToast('Correct! +5 XP', 'success');
    gs.correct++; state.xp += 5;
  } else {
    btns[i].classList.add('wrong');
    btns[q.correct].classList.add('correct');
    showToast('Wrong!', 'error');
  }
  updateXP();
  setTimeout(() => { gs.index++; renderGame(); }, i === q.correct ? 1000 : 1800);
}

function showResult() {
  let gs = gameState;
  let pct = Math.round((gs.correct / gs.total) * 100);
  $('gameBody').innerHTML = `
    <div class="result-wrap">
      <div class="result-emoji">${pct >= 80 ? '🔥' : '💪'}</div>
      <div class="result-title">Practice Complete!</div>
      <div class="result-sub">You scored ${gs.correct} out of ${gs.total}</div>
      <div style="margin-top:20px; display:flex; gap:10px; justify-content:center;">
        <button class="btn-secondary" onclick="quitGame()">Back</button>
        <button class="btn-primary" onclick="startGame('${gs.sectionKey}')">Play Again</button>
      </div>
    </div>
  `;
}

function quitGame() { gameState = null; showScreen('screen-lesson'); }

renderHome();
</script>
</body>
</html>
