<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Grammar Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070913;--surface:#101425;--surface-2:#141a2e;--purple:#8b5cf6;--purple-light:#a78bfa;--blue:#3b82f6;--text:#f8fafc;--text-muted:#94a3b8;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.14);--grad:linear-gradient(135deg,#a78bfa,#8b5cf6,#3b82f6);--r:20px;--shadow:0 18px 50px -20px rgba(0,0,0,.85);--glow:0 0 0 1px rgba(139,92,246,.45),0 18px 60px -18px rgba(139,92,246,.55)}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:"Outfit",system-ui,sans-serif;line-height:1.6;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--purple),var(--blue));border-radius:999px;border:2px solid var(--bg)}
.mono{font-family:"Space Grotesk",monospace}
.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(120px)}
.orb-p{width:520px;height:520px;background:#8b5cf6;top:-160px;left:-120px;opacity:.4}
.orb-b{width:560px;height:560px;background:#3b82f6;top:30%;right:-200px;opacity:.3}
.orb-v{width:460px;height:460px;background:#a78bfa;bottom:-180px;left:35%;opacity:.22}
.container{width:100%;max-width:1180px;margin-inline:auto;padding-inline:24px;position:relative;z-index:1}
header{position:sticky;top:0;z-index:100;background:rgba(10,13,26,.55);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:24px;height:74px}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:1.15rem;cursor:pointer}
.logo-mark{width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;font-family:"Space Grotesk",monospace;font-size:.95rem;color:#fff}
.nav{display:flex;gap:6px}
.nav a{padding:9px 16px;border-radius:999px;font-size:.92rem;font-weight:500;color:var(--text-muted);text-decoration:none;cursor:pointer;transition:all .25s}
.nav a:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nav a.active{color:var(--text);background:rgba(139,92,246,.14);box-shadow:inset 0 0 0 1px rgba(139,92,246,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-family:"Outfit",sans-serif;font-size:.94rem;font-weight:600;padding:13px 26px;border-radius:999px;border:1px solid transparent;cursor:pointer;text-decoration:none;transition:all .25s}
.btn-primary{color:#fff;background:var(--grad);background-size:180% 180%;box-shadow:0 12px 34px -14px rgba(139,92,246,.95)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{color:var(--text);background:rgba(255,255,255,.03);border-color:var(--border-strong)}
.btn-sm{padding:8px 16px;font-size:.82rem}
.page{padding:40px 0 100px;min-height:70vh}
.section-title{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:700;margin-bottom:12px}
.section-sub{color:var(--text-muted);margin-bottom:36px;max-width:620px}
.eyebrow{font-family:"Space Grotesk",monospace;font-size:.72rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:22px}
.card{position:relative;padding:28px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:all .35s}
.card:hover{transform:translateY(-5px);border-color:rgba(139,92,246,.6);box-shadow:var(--glow)}
.card.locked{cursor:not-allowed;opacity:.55}
.card-icon{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem;margin-bottom:20px;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.28);color:var(--purple-light)}
.card h3{font-size:1.12rem;font-weight:600;margin-bottom:8px}
.card p{font-size:.9rem;color:var(--text-muted)}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);font-size:.88rem;margin-bottom:22px;cursor:pointer}
.back-link:hover{color:var(--purple-light)}

/* ── RICH DETAIL DESIGN (Image 2/3) ── */
.rich-hero{padding:36px;border-radius:var(--r);background:linear-gradient(160deg,rgba(139,92,246,.14),rgba(59,130,246,.06)),var(--surface);border:1px solid rgba(139,92,246,.25);margin-bottom:24px;position:relative;overflow:hidden}
.rich-hero::before{content:"";position:absolute;top:-50%;left:-20%;width:400px;height:400px;background:radial-gradient(circle,rgba(167,139,250,.15),transparent 70%);pointer-events:none}
.rich-hero .num{display:inline-block;font-family:"Space Grotesk",monospace;font-size:1.2rem;font-weight:700;color:var(--purple-light);margin-bottom:10px}
.rich-hero h1{font-size:clamp(1.8rem,4.5vw,2.8rem);font-weight:800;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;line-height:1.1}
.rich-hero .meaning{font-size:1.08rem;color:var(--text);font-weight:500}

.rich-box{padding:26px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);margin-bottom:18px;position:relative}
.rich-box .box-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.box-head .box-icon{width:32px;height:32px;border-radius:10px;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.3);display:grid;place-items:center;font-size:.9rem;color:var(--purple-light);flex-shrink:0}
.box-head h4{font-size:1.05rem;font-weight:600;color:var(--text);margin:0}
.box-head .num-badge{margin-left:auto;font-family:"Space Grotesk",monospace;font-size:.75rem;font-weight:700;background:rgba(255,255,255,.05);padding:4px 10px;border-radius:999px;color:var(--text-muted)}
.rich-box .box-body{font-size:.95rem;color:var(--text);line-height:1.7}
.rich-box .box-body p{margin-bottom:10px}
.rich-box .box-body p:last-child{margin-bottom:0}

/* Formula / Rule */
.formula-box{padding:16px 20px;background:rgba(0,0,0,.3);border-left:3px solid var(--purple);border-radius:12px;font-family:"Space Grotesk",monospace;font-size:.92rem;color:var(--text);font-weight:600;margin-bottom:12px}
.rule-explain-box{padding:14px 18px;background:rgba(34,197,94,.06);border-left:3px solid #22c55e;border-radius:12px;font-size:.88rem;color:var(--text-muted);line-height:1.6;margin-top:10px}
.rule-explain-box b{color:#22c55e;font-family:"Space Grotesk",monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:4px}

/* Structure Cards Grid (Image 2) */
.struct-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.struct-card{padding:18px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--border);transition:all .25s}
.struct-card:hover{border-color:rgba(139,92,246,.5);background:rgba(139,92,246,.08)}
.struct-card .s-type{font-family:"Space Grotesk",monospace;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--purple-light);margin-bottom:10px}
.struct-card .s-formula{font-family:"Space Grotesk",monospace;font-size:.82rem;color:#fbbf24;line-height:1.6;margin-bottom:10px;font-weight:500}
.struct-card .s-example{font-size:.9rem;color:var(--text);font-style:italic;margin-bottom:8px}
.struct-card .s-explain{font-size:.78rem;color:var(--text-muted);padding-top:8px;border-top:1px dashed rgba(255,255,255,.1)}

/* Examples Blocks (Image 2/3) */
.examples-list{display:flex;flex-direction:column;gap:10px}
.ex-item{padding:16px 18px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--border);border-left:3px solid var(--blue)}
.ex-item .ex-en{font-size:1rem;font-weight:600;color:var(--text);margin-bottom:4px}
.ex-item .ex-hi{font-size:.9rem;color:var(--purple-light);margin-bottom:6px}
.ex-item .ex-note{font-size:.78rem;color:var(--text-muted);font-style:italic;display:flex;align-items:center;gap:4px}
.ex-item .ex-note::before{content:"💡";font-style:normal}

/* Practice btn group */
.practice-group{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.practice-group .btn{flex:1;min-width:140px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(4,6,15,.85);backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{width:100%;max-width:680px;max-height:92vh;overflow-y:auto;background:var(--surface);border:1px solid rgba(139,92,246,.35);border-radius:24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.9)}
.modal-head{padding:24px 28px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);z-index:2}
.modal-head h3{font-size:1.1rem;font-weight:700}
.modal-head .sub{font-family:"Space Grotesk",monospace;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--purple-light);margin-top:4px}
.close-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);cursor:pointer;display:grid;place-items:center}
.close-btn:hover{background:rgba(139,92,246,.2)}
.modal-body{padding:24px 28px 28px}
.progress-row{display:flex;justify-content:space-between;margin-bottom:10px;font-family:"Space Grotesk",monospace;font-size:.78rem;color:var(--text-muted)}
.progress-bar{height:6px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden;margin-bottom:22px}
.progress-fill{height:100%;background:var(--grad);border-radius:999px;transition:width .4s;width:0%}
.q-text{font-size:1.05rem;font-weight:500;line-height:1.6;margin-bottom:20px;padding:20px;background:rgba(0,0,0,.25);border-radius:14px;border-left:3px solid var(--purple)}
.q-hint{margin-top:10px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.12);font-size:.82rem;color:var(--purple-light)}
.options{display:grid;gap:10px;margin-bottom:16px}
.opt{padding:14px 18px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--text);font-size:.96rem;font-weight:500;cursor:pointer;text-align:left;transition:all .2s;display:flex;align-items:center;gap:10px}
.opt:hover:not(.disabled){background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.45)}
.opt .key{font-family:"Space Grotesk",monospace;font-size:.72rem;width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,.06);display:grid;place-items:center;color:var(--text-muted);flex-shrink:0}
.opt.correct{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.6);color:#86efac}
.opt.wrong{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.6);color:#fca5a5}
.opt.disabled{cursor:not-allowed;opacity:.7}
.feedback{margin-top:14px;padding:12px 16px;border-radius:12px;font-size:.9rem;font-weight:500;display:none}
.feedback.show{display:block}
.feedback.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);color:#86efac}
.feedback.bad{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5}
.modal-foot{display:flex;justify-content:space-between;align-items:center;padding-top:16px;border-top:1px solid var(--border);margin-top:8px}
.score-chip{font-family:"Space Grotesk",monospace;font-size:.82rem;color:var(--text-muted)}
.score-chip b{color:var(--purple-light)}

/* Chat */
.chat-wrap{max-width:720px;margin:0 auto}
.chat-box{padding:24px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);min-height:400px;max-height:520px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.msg{max-width:80%;padding:12px 16px;border-radius:16px;font-size:.95rem;line-height:1.55}
.msg.bot{background:var(--surface-2);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
.msg.user{background:var(--grad);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg .hi{display:block;margin-top:6px;font-size:.85em;opacity:.9;font-style:italic;white-space:pre-wrap}
.chat-input{display:flex;gap:10px}
.chat-input input{flex:1;padding:14px 18px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:"Outfit",sans-serif;font-size:.95rem;outline:none}
.chat-input input:focus{border-color:rgba(139,92,246,.6)}
.quick-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text-muted);font-size:.82rem;cursor:pointer;transition:all .2s}
.chip:hover{color:var(--text);border-color:rgba(139,92,246,.5)}

@media(max-width:640px){.nav{display:none}.modal-body,.modal-head{padding:20px}}
</style>
</head>
<body>
<div class="orbs"><div class="orb orb-p"></div><div class="orb orb-b"></div><div class="orb orb-v"></div></div>

<header>
  <div class="container header-inner">
    <a class="logo" onclick="go('home')"><span class="logo-mark">EG</span><span>Grammar Hub</span></a>
    <nav class="nav" id="nav">
      <a onclick="go('home')" data-view="home">Home</a>
      <a onclick="go('m1')" data-view="m1">Module 1</a>
      <a onclick="go('m2')" data-view="m2">Module 2</a>
    </nav>
  </div>
</header>

<main class="page"><div class="container" id="app"></div></main>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-head">
      <div><h3 id="m-title">Practice</h3><div class="sub" id="m-sub">Basic</div></div>
      <button class="close-btn" onclick="closePractice()">×</button>
    </div>
    <div class="modal-body">
      <div class="progress-row"><span id="m-progress-text">Q 1 / 7</span><span id="m-score">Score 0</span></div>
      <div class="progress-bar"><div class="progress-fill" id="m-fill"></div></div>
      <div class="q-text" id="m-q"></div>
      <div class="options" id="m-opts"></div>
      <div class="feedback" id="m-fb"></div>
      <div class="modal-foot">
        <span class="score-chip">Correct: <b id="m-correct">0</b> / <span id="m-total">7</span></span>
        <button class="btn btn-primary btn-sm" id="m-next" onclick="nextQuestion()">Next →</button>
      </div>
    </div>
  </div>
</div>

<script src="module1.js"></script>
<script src="module2.js"></script>
<script src="module3.js"></script>
<script src="module4.js"></script>
<script>
// Sound, Data Check, State
let audioCtx=null, muted=false;
function ensureAudio(){ if(audioCtx) return audioCtx; try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} return audioCtx; }
function tone(f,d,t='sine',v=0.08,dl=0){ if(muted) return; const c=ensureAudio(); if(!c) return; if(c.state==='suspended') c.resume(); const o=c.createOscillator(), g=c.createGain(); o.type=t; o.frequency.value=f; o.connect(g); g.connect(c.destination); const tm=c.currentTime+dl; g.gain.setValueAtTime(0.0001,tm); g.gain.linearRampToValueAtTime(v,tm+0.01); g.gain.exponentialRampToValueAtTime(0.0001,tm+d); o.start(tm); o.stop(tm+d+0.03); }
function sfxClick(){tone(560,.05,'sine',.035)} function sfxCorrect(){tone(659,.12,'sine',.09);tone(784,.12,'sine',.09,.1);tone(1046,.2,'sine',.09,.2)} function sfxWrong(){tone(220,.14,'sawtooth',.045);tone(165,.2,'sawtooth',.045,.11)} function sfxFinish(){tone(523,.12,'sine',.1);tone(659,.12,'sine',.1,.12);tone(784,.12,'sine',.1,.24);tone(1046,.34,'sine',.1,.36)}
document.addEventListener('click',e=>{ if(e.target.closest('.opt')) return; sfxClick(); });

if(!window.MODULE1) window.MODULE1={verbToBe:[],modalVerbs:[],semiModals:[],verbForms:{}};
if(!window.MODULE2) window.MODULE2={sentences:[],clauses:[],tenseGroups:{},spokenPhrases:[]};
const M1=window.MODULE1, M2=window.MODULE2;
const S={ view:'home', m1cat:null, m1item:null, m1letter:null, m2cat:null, m2sub:null, m2item:null };
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// Nav
function go(v){S.view=v;S.m1cat=S.m1item=S.m1letter=S.m2cat=S.m2sub=S.m2item=null;render();}
function goM1Cat(k){S.view='m1cat';S.m1cat=k;render();} function goM1Detail(i){S.view='m1detail';S.m1item=i;render();}
function goM2Cat(k){S.view='m2cat';S.m2cat=k;render();} function goM2Sub(k){S.view='m2sub';S.m2sub=k;render();} function goM2Detail(i){S.view='m2detail';S.m2item=i;render();}
function goBack(){ if(S.view==='m1detail')S.view='m1cat'; else if(S.view==='m1cat')S.view='m1'; else if(S.view==='m2cat')S.view='m2'; else if(S.view==='m2sub')S.view='m2cat'; else if(S.view==='m2detail')S.view=S.m2cat==='tense'?'m2sub':'m2cat'; else S.view='home'; render(); }

// Master Render
function render(){
  const app=document.getElementById('app'); let html='';
  if(S.view==='home') html=viewHome();
  else if(S.view==='m1') html=viewM1Home();
  else if(S.view==='m1cat') html=viewM1Cat();
  else if(S.view==='m1detail') html=viewM1Detail();
  else if(S.view==='m2') html=viewM2Home();
  else if(S.view==='m2cat') html=viewM2Cat();
  else if(S.view==='m2sub') html=viewM2Sub();
  else if(S.view==='m2detail') html=viewM2Detail();
  else if(S.view==='m2spoken') html=viewM2Spoken();
  else html=viewHome();
  app.innerHTML=html;
  document.querySelectorAll('#nav a').forEach(a=>{a.classList.toggle('active', a.dataset.view===S.view || (S.view==='m2spoken'&&a.dataset.view==='m2'));});
  window.scrollTo({top:0,behavior:'smooth'});
  if(S.view==='m2spoken') initChat();
}

// Home
function viewHome(){ return `<div class="fade-up"><span class="eyebrow">Interactive Learning</span><h1 class="section-title" style="font-size:clamp(2rem,5vw,3.2rem)">Master English Grammar</h1><p class="section-sub">Choose a module. Deep rules, Hindi examples, and smart practice.</p></div><div class="grid"><div class="card" onclick="go('m1')"><div class="card-icon mono">01</div><h3>Module 1 — Grammar Basics</h3><p>Verb to Be, Modals, Semi Modals, A–Z Forms.</p></div><div class="card" onclick="go('m2')"><div class="card-icon mono">02</div><h3>Module 2 — Sentence Structure</h3><p>Sentence, Clause, Tense, Spoken AI Chat.</p></div><div class="card locked"><div class="card-icon mono">03</div><h3>Module 3</h3><p>Coming Soon</p></div><div class="card locked"><div class="card-icon mono">04</div><h3>Module 4</h3><p>Coming Soon</p></div></div>`; }

// Module 1
function viewM1Home(){ return `<a class="back-link" onclick="go('home')">← Back</a><h1 class="section-title">Grammar Basics</h1><div class="grid">${['verbToBe','modal','semiModal'].map(k=>`<div class="card" onclick="goM1Cat('${k}')"><h3>${k}</h3></div>`).join('')}</div>`; }
function viewM1Cat(){ return `<a class="back-link" onclick="goBack()">← Back</a><h1 class="section-title">${S.m1cat}</h1><div class="grid">${(M1[S.m1cat==='verbToBe'?'verbToBe':S.m1cat==='modal'?'modalVerbs':'semiModals']||[]).map((d,i)=>`<div class="card" onclick="goM1Detail(${i})"><h3>${esc(d.v)}</h3><p>${esc(d.hi)}</p></div>`).join('')}</div>`; }
function viewM1Detail(){ 
  let d;
  if(S.m1cat==='verbToBe') d=(M1.verbToBe||[])[S.m1item];
  else if(S.m1cat==='modal') d=(M1.modalVerbs||[])[S.m1item];
  else d=(M1.semiModals||[])[S.m1item];
  if(!d) return '<p>Not found.</p>';
  return `<a class="back-link" onclick="goBack()">← Back</a>
  <div class="rich-hero"><h1>${esc(d.v)}</h1><div class="meaning">${esc(d.hi)}</div></div>
  <div class="rich-box"><div class="box-head"><div class="box-icon">💡</div><h4>Usage</h4></div><div class="box-body">${esc(d.use)}</div></div>
  <div class="rich-box"><div class="box-head"><div class="box-icon">🔺</div><h4>Rules</h4></div><div class="formula-box">${esc(d.rules)}</div></div>
  <div class="rich-box"><div class="box-head"><div class="box-icon">✅</div><h4>Examples</h4></div><div class="examples-list"><div class="ex-item"><div class="ex-en">${esc(d.s.simple)}</div></div><div class="ex-item"><div class="ex-en">${esc(d.s.neg)}</div></div><div class="ex-item"><div class="ex-en">${esc(d.s.wh)}</div></div></div></div>
  `;
}

function viewM2Home(){ return `<a class="back-link" onclick="go('home')">← Back</a><h1 class="section-title">Sentence Structure</h1><div class="grid"><div class="card" onclick="goM2Cat('sentence')"><h3>Sentence</h3></div><div class="card" onclick="goM2Cat('clause')"><h3>Clause</h3></div><div class="card" onclick="goM2Cat('tense')"><h3>Tense</h3></div><div class="card" onclick="S.view='m2spoken';render()"><h3>Spoken AI Chat</h3></div></div>`; }

// Module 2 Cat List
function viewM2Cat(){

    return `<a class="back-link" onclick="goBack()">← Back</a><h1 class="section-title">Tenses</h1>
    <button class="btn btn-primary" style="margin-bottom:20px" onclick="openAllPractice()">🎯 All Practice (Mixed)</button>
    <div class="grid">${Object.entries(M2.tenseGroups||{}).map(([k,g])=>`<div class="card" onclick="goM2Sub('${k}')"><h3>${g.title}</h3></div>`).join('')}</div>`;

// Module 2 Sub (Tense types)
function viewM2Sub(){
  const g = (M2.tenseGroups||{})[S.m2sub]; if(!g) return '';
  return `<a class="back-link" onclick="goBack()">← Back</a><h1 class="section-title">${g.title}</h1>
  <button class="btn btn-primary" style="margin-bottom:20px" onclick="openAllPractice()">🎯 All Practice (Mixed)</button>

}

// ── RICH DETAIL VIEW (Image 2/3 style) ──
function viewM2Detail(){
  let d;
  if(S.m2cat==='sentence') d=(M2.sentences||[])[S.m2item];
  else if(S.m2cat==='clause') d=(M2.clauses||[])[S.m2item];
  else if(S.m2cat==='tense'){ const g=(M2.tenseGroups||{})[S.m2sub]; d=g?g.types[S.m2item]:null; }
  if(!d) return '<p>Not found.</p>';

  const exKeys = d.examples ? Object.keys(d.examples) : [];
  const labels = { simple: 'Simple', negative: 'Negative', wh: 'WH-Question' };

  return `
  <a class="back-link" onclick="goBack()">← Back</a>

  <!-- Hero -->
  <div class="rich-hero">
    <div class="num">${S.m2item+1}</div>
    <h1>${esc(d.title)}</h1>
    <div class="meaning">${esc(d.hi)}</div>
  </div>

  <!-- 1. Definition -->
  ${d.definition ? `<div class="rich-box"><div class="box-head"><div class="box-icon">📖</div><h4>Definition</h4><span class="num-badge">1</span></div><div class="box-body"><p>${esc(d.definition)}</p></div></div>` : ''}

  <!-- 2. Kahan Use Hota Hai -->
  ${d.usage ? `<div class="rich-box"><div class="box-head"><div class="box-icon">💡</div><h4>Kahan Use Hota Hai</h4><span class="num-badge">2</span></div><div class="box-body"><p>${esc(d.usage)}</p></div></div>` : ''}

  <!-- 3. Banane Ka Niyam -->
  ${d.rule ? `<div class="rich-box"><div class="box-head"><div class="box-icon">🔺</div><h4>Banane Ka Niyam</h4><span class="num-badge">3</span></div>
    <div class="formula-box">${esc(d.rule)}</div>
    ${d.ruleExplain ? `<div class="rule-explain-box"><b>RULE EXPLAIN</b>${esc(d.ruleExplain)}</div>` : ''}
  </div>` : ''}

  <!-- 4. Pehchaan Ka Niyam -->
  ${d.recognition ? `<div class="rich-box"><div class="box-head"><div class="box-icon">🔍</div><h4>Pehchaan Ka Niyam</h4><span class="num-badge">4</span></div><div class="box-body"><p>${esc(d.recognition)}</p></div></div>` : ''}

  <!-- 5. Structure with Examples -->
  ${d.structures && d.structures.length ? `<div class="rich-box"><div class="box-head"><div class="box-icon">🎯</div><h4>Structure with Examples</h4><span class="num-badge">5</span></div>
    <div class="struct-grid">
      ${d.structures.map(s=>`<div class="struct-card"><div class="s-type">${esc(s.type)}</div><div class="s-formula">${esc(s.formula)}</div><div class="s-example">${esc(s.example)}</div>${s.exampleExplain?`<div class="s-explain">💡 ${esc(s.exampleExplain)}</div>`:''}</div>`).join('')}
    </div>
  </div>` : ''}

  <!-- 6. Examples -->
  ${d.examples ? `<div class="rich-box"><div class="box-head"><div class="box-icon">✅</div><h4>Examples</h4><span class="num-badge">6</span></div>
    ${exKeys.map(k=>{
      const arr = d.examples[k] || [];
      if(!arr.length) return '';
      return `<div style="margin-bottom:16px"><div class="s-type" style="margin-bottom:8px;color:var(--text-muted)">${labels[k]||k}</div>
        <div class="examples-list">
          ${arr.map(ex=>`<div class="ex-item"><div class="ex-en">${esc(ex.en)}</div><div class="ex-hi">${esc(ex.hi)}</div>${ex.note?`<div class="ex-note">${esc(ex.note)}</div>`:''}</div>`).join('')}
        </div>
      </div>`;
    }).join('')}
  </div>` : ''}

  <!-- Practice buttons -->
  <div class="practice-group">
    <button class="btn btn-primary" onclick="openPractice('${S.m2cat}','${S.m2item}')">Practice ⚡</button>
    ${S.m2cat==='tense'?`<button class="btn btn-ghost" onclick="openAllPractice()">All Practice 🎯</button>`:''}
  </div>
  `;
}

// Spoken Chat View
function viewM2Spoken(){
  return `<a class="back-link" onclick="goBack()">← Back</a><h1 class="section-title">Spoken AI Chat</h1><p class="section-sub">Ask about any grammar topic, or just chat with me.</p>
  <div class="chat-wrap"><div class="quick-chips">
    <button class="chip" onclick="sendSpoken('What is present perfect tense?')">Present Perfect?</button>
    <button class="chip" onclick="sendSpoken('What is your name?')">Your Name?</button>
    <button class="chip" onclick="sendSpoken('What is your age?')">Your Age?</button>
    <button class="chip" onclick="sendSpoken('Who made you?')">Who made you?</button>
  </div>
  <div class="chat-box" id="chat-box"></div>
  <div class="chat-input"><input id="chat-in" placeholder="Type a question..." onkeydown="if(event.key==='Enter')sendSpoken()"><button class="btn btn-primary" onclick="sendSpoken()">Send</button></div></div>`;
}

let chatInit=false;
function initChat(){ const b=document.getElementById('chat-box'); if(!b||chatInit) return; chatInit=true; addBotMsg('Hello! 👋 Main aapka AI Spoken Chat hoon. Mujhe grammar ke baare me kuch bhi pucho — ya mera naam, age, developer puch sakte ho!', 'नमस्ते! मैं आपका AI Spoken Chat हूँ।'); }
function addBotMsg(en,hi){ const b=document.getElementById('chat-box'); if(!b) return; const d=document.createElement('div'); d.className='msg bot'; d.innerHTML=`${esc(en)}<span class="hi">${esc(hi)}</span>`; b.appendChild(d); b.scrollTop=b.scrollHeight; }
function addUserMsg(t){ const b=document.getElementById('chat-box'); if(!b) return; const d=document.createElement('div'); d.className='msg user'; d.textContent=t; b.appendChild(d); b.scrollTop=b.scrollHeight; }

// ── SMART AI CHAT ENGINE ──
function sendSpoken(quick){
  if(S.view!=='m2spoken') return;
  const inp=document.getElementById('chat-in'); const txt=quick || (inp?inp.value.trim():'');
  if(!txt) return;
  if(!quick && inp) inp.value='';
  addUserMsg(txt);
  setTimeout(()=>{ const r=aiAnswer(txt); addBotMsg(r.en, r.hi); }, 300);
}

function aiAnswer(q){
  const lower = q.toLowerCase();

  // 1. Personal / Meta questions
  if (lower.includes('name') && (lower.includes('your')||lower.includes('tumhara'))) {
    return { en: "My name is AI Spoken Chat.", hi: "मेरा नाम AI Spoken Chat है।" };
  }
  if (lower.includes('age') || lower.includes('umar')) {
    return { en: "I don't have a human age. I am an AI, developed by Suraj Prajapati.", hi: "मेरी उम्र नहीं है। मैं एक AI हूँ, जिसे सूरज प्रजापति ने बनाया है।" };
  }
  if (lower.includes('who made') || lower.includes('developer') || lower.includes('kisne banaya') || lower.includes('suraj')) {
    return { en: "I was developed by Suraj Prajapati.", hi: "मुझे सूरज प्रजापति ने विकसित किया है।" };
  }
  if (lower.includes('how are you') || lower.includes('kaise ho')) {
    return { en: "I am fine, thank you! How are you?", hi: "मैं ठीक हूँ, धन्यवाद! आप कैसे हैं?" };
  }

  // 2. Grammar Search (M2)
  const findM2 = () => {
    const all=[];
    (M2.sentences||[]).forEach(s=>all.push({type:'sentence',d:s}));
    (M2.clauses||[]).forEach(c=>all.push({type:'clause',d:c}));
    Object.values(M2.tenseGroups||{}).forEach(g=>(g.types||[]).forEach(t=>all.push({type:'tense',d:t})));
    return all.find(x => lower.includes(x.d.title.toLowerCase().split(' ')[0].toLowerCase()) || lower.includes(x.d.id));
  };
  const m2 = findM2();
  if (m2) {
    const d = m2.d;
    const ex = d.examples?.simple?.[0] || {en:'',hi:''};
    return {
      en: `${d.title}\n\nDefinition: ${d.definition||''}\n\nUse: ${d.usage||''}\n\nRule: ${d.rule||''}\n\nExample: ${ex.en}`,
      hi: `${d.hi}\n\n${d.ruleExplain||''}\n\n${ex.hi}`
    };
  }

  // 3. Grammar Search (M1)
  const findM1 = () => {
    const all = [
      ...(M1.verbToBe||[]).map(v=>({cat:'Verb to Be',d:v})),
      ...(M1.modalVerbs||[]).map(v=>({cat:'Modal Verb',d:v})),
      ...(M1.semiModals||[]).map(v=>({cat:'Semi Modal',d:v}))
    ];
    return all.find(x => lower.includes(x.d.v.toLowerCase()));
  };
  const m1 = findM1();
  if (m1) {
    return {
      en: `${m1.d.v} (${m1.cat})\n\n${m1.d.s.simple}\n${m1.d.s.neg}\n${m1.d.s.wh}`,
      hi: `Meaning: ${m1.d.hi}\n\nUsage: ${m1.d.use}`
    };
  }

  // 4. Fallback
  return {
    en: "I can help with Sentences, Clauses, Tenses, Verbs, or just chat! Try asking: 'What is present perfect tense?' or 'Who made you?'",
    hi: "मैं Sentence, Clause, Tense, Verbs के बारे में बता सकता हूँ, या सामान्य बातचीत कर सकता हूँ।"
  };
}

// ── PRACTICE ENGINE ──
let P=null;

// Normal practice (sirf us topic ka basic)
function openPractice(cat, idx){
  let d;
  if(cat==='sentence') d=(M2.sentences||[])[idx];
  else if(cat==='clause') d=(M2.clauses||[])[idx];
  else if(cat==='tense'){ const g=(M2.tenseGroups||{})[S.m2sub]; d=g?g.types[idx]:null; }
  if(!d || !d.practice || !d.practice.basic || !d.practice.basic.length) { alert('No practice questions available for this topic.'); return; }
  
  P = { title:d.title, questions: shuffle(d.practice.basic), current:0, answered:false, correctCount:0, selected:null };
  showModal();
}

// All practice (saare tenses mix)
function openAllPractice(){
  let allQ = [];
  Object.values(M2.tenseGroups||{}).forEach(g=>{
    (g.types||[]).forEach(t=>{
      if(t.practice && t.practice.basic) allQ = allQ.concat(t.practice.basic.map(q=>({...q, src:t.title})));
    });
  });
  if(!allQ.length) { alert('No practice data available.'); return; }
  P = { title:'All Practice (Mixed)', questions: shuffle(allQ), current:0, answered:false, correctCount:0, selected:null };
  showModal();
}

function showModal(){
  document.getElementById('modal').classList.add('open');
  document.getElementById('m-title').textContent = P.title;
  document.getElementById('m-sub').textContent = 'Practice';
  document.getElementById('m-next').onclick = nextQuestion;
  renderPractice();
}
function closePractice(){ document.getElementById('modal').classList.remove('open'); P=null; }

function renderPractice(){
  const q = P.questions[P.current];
  if(!q){ document.getElementById('m-q').textContent = 'No questions.'; return; }
  document.getElementById('m-progress-text').textContent = `Q ${P.current+1} / ${P.questions.length}`;
  document.getElementById('m-score').textContent = `Score ${P.correctCount}`;
  document.getElementById('m-fill').style.width = `${(P.current/P.questions.length)*100}%`;
  document.getElementById('m-q').innerHTML = esc(q.q) + (q.src ? `<div class="q-hint">💡 Topic: ${esc(q.src)}</div>` : '');
  document.getElementById('m-correct').textContent = P.correctCount;
  document.getElementById('m-total').textContent = P.questions.length;
  
  const optsEl = document.getElementById('m-opts'); optsEl.innerHTML = '';
  q.options.forEach((o,i)=>{
    const b = document.createElement('button');
    b.className = 'opt' + (P.answered?' disabled':'');
    b.innerHTML = `<span class="key">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span>`;
    if(P.answered){ if(o===q.answer) b.classList.add('correct'); else if(o===P.selected) b.classList.add('wrong'); }
    b.onclick = ()=>selectOpt(o);
    optsEl.appendChild(b);
  });
  
  const fb = document.getElementById('m-fb');
  fb.className='feedback'; fb.textContent='';
  if(P.answered){ 
    if(P.selected===q.answer){ fb.className='feedback show ok'; fb.textContent='✓ Correct!'; } 
    else { fb.className='feedback show bad'; fb.textContent=`✗ Wrong. Correct: ${q.answer}`; } 
  }
  document.getElementById('m-next').textContent = P.current >= P.questions.length-1 ? 'Finish' : 'Next →';
}

function selectOpt(opt){
  if(P.answered) return;
  const q = P.questions[P.current];
  P.answered = true; P.selected = opt;
  if(opt===q.answer){ P.correctCount++; sfxCorrect(); } else { sfxWrong(); }
  renderPractice();
}

function nextQuestion(){
  if(P.current >= P.questions.length-1){
    sfxFinish();
    document.getElementById('m-q').innerHTML = `<div style="text-align:center;padding:20px 0"><div style="font-size:2.6rem;margin-bottom:12px">🎉</div><div style="font-size:1.2rem;font-weight:700">Done!</div><div>Score: <b>${P.correctCount}</b> / ${P.questions.length}</div></div>`;
    document.getElementById('m-opts').innerHTML = '';
    document.getElementById('m-fb').className='feedback';
    document.getElementById('m-next').textContent = 'Close';
    document.getElementById('m-next').onclick = closePractice;
    return;
  }
  P.current++; P.answered=false; P.selected=null;
  renderPractice();
}

// Init
render();
</script>
