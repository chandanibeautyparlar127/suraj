<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>English Mastery | Premium Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
/* ================= PREMIUM LEXORA-STYLE DESIGN ================= */
:root {
  --bg-main: #070913; --bg-card: #101425; --bg-hover: #181e36; --bg-inner: #0a0d1a;
  --purple: #8b5cf6; --purple-light: #a78bfa; --blue: #3b82f6;
  --green: #10b981; --green-bg: rgba(16, 185, 129, 0.1);
  --red: #ef4444; --red-bg: rgba(239, 68, 68, 0.1);
  --yellow: #f59e0b; --text-main: #f8fafc; --text-muted: #94a3b8;
  --border: rgba(255, 255, 255, 0.08); --border-glow: rgba(139, 92, 246, 0.3);
  --font-main: "Outfit", sans-serif; --font-code: "Space Grotesk", monospace;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-main); background-color: var(--bg-main); color: var(--text-main);
  min-height: 100vh; overflow-x: hidden; line-height: 1.6;
  background-image: radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.05), transparent 25%), radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.05), transparent 25%);
}
button { font-family: inherit; cursor: pointer; border: none; outline: none; background: none; color: inherit; }
a { text-decoration: none; color: inherit; }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-main); }
::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: var(--purple); }

/* Screens */
.screen { display: none; min-height: 100vh; }
.screen.active { display: block; animation: fadeUp 0.5s var(--ease) forwards; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* Headers */
.nav-header { padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; background: rgba(7, 9, 19, 0.9); backdrop-filter: blur(10px); }
.nav-brand { font-family: var(--font-code); font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #a78bfa, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.stat-pill { padding: 6px 12px; border-radius: 20px; background: var(--bg-card); border: 1px solid var(--border); font-family: var(--font-code); font-size: 13px; }

/* Home */
.hero { text-align: center; padding: 60px 20px 40px; }
.hero h1 { font-size: 42px; font-weight: 800; margin-bottom: 12px; }
.hero h1 span { color: var(--purple-light); }
.modules-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; padding: 20px 24px 80px; }
.module-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 30px; cursor: pointer; transition: all 0.3s var(--ease); }
.module-card:hover { transform: translateY(-5px); border-color: var(--border-glow); box-shadow: 0 10px 30px rgba(139, 92, 246, 0.1); }
.mc-icon { width: 60px; height: 60px; border-radius: 16px; background: rgba(139, 92, 246, 0.1); display: grid; place-items: center; font-size: 28px; margin-bottom: 20px; }
.mc-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.mc-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }

/* Page Header */
.page-header { max-width: 900px; margin: 0 auto; padding: 30px 24px 20px; display: flex; align-items: center; gap: 20px; }
.btn-back { padding: 10px 20px; border-radius: 12px; background: var(--bg-card); border: 1px solid var(--border); font-weight: 600; }
.btn-back:hover { background: var(--bg-hover); border-color: var(--purple); }

/* Cards List */
.cards-container { max-width: 900px; margin: 0 auto; padding: 0 24px 80px; display: flex; flex-direction: column; gap: 16px; }
.lesson-card-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; display: flex; align-items: center; gap: 20px; cursor: pointer; transition: all 0.2s; }
.lesson-card-item:hover { background: var(--bg-hover); border-color: var(--purple-light); transform: translateX(5px); }
.lci-num { width: 40px; height: 40px; border-radius: 12px; background: rgba(59, 130, 246, 0.15); color: var(--blue); display: grid; place-items: center; font-weight: 700; }
.lci-title { font-size: 18px; font-weight: 600; }
.lci-sub { font-size: 13px; color: var(--text-muted); }

/* Lesson Content */
.lesson-content { max-width: 900px; margin: 0 auto; padding: 0 24px 100px; }
.lesson-h1 { font-size: 32px; font-weight: 800; margin-bottom: 8px; }
.content-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
.cs-header { font-size: 18px; font-weight: 700; color: var(--blue); margin-bottom: 16px; display: flex; align-items: center; gap: 10px;}
.cs-text { font-size: 15px; color: #cbd5e1; }
.formula-box { background: var(--bg-inner); border-left: 4px solid var(--purple); border-radius: 8px; padding: 16px; font-family: var(--font-code); font-size: 16px; margin: 16px 0; }

/* Notebook Style Clickable Buttons */
.clickable-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 16px; }
.click-btn { padding: 12px; background: var(--bg-inner); border: 1px solid var(--border); border-radius: 10px; font-size: 16px; font-weight: 600; color: var(--yellow); text-align: center; transition: all 0.2s; }
.click-btn:hover { background: var(--bg-hover); border-color: var(--yellow); transform: translateY(-2px); }
.click-btn.active { background: var(--purple); color: white; border-color: var(--purple); }

/* Detail View (When clicked on 'was') */
.detail-view { display: none; background: var(--bg-inner); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 20px; animation: fadeUp 0.3s; }
.detail-view.active { display: block; }
.dv-header { font-size: 22px; font-weight: 800; color: var(--purple-light); margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
.dv-row { margin-bottom: 16px; background: var(--bg-card); padding: 16px; border-radius: 8px; border-left: 3px solid var(--blue); }
.dv-title { font-size: 12px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; letter-spacing: 1px; font-weight: 700; }
.dv-en { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.dv-hi { font-size: 14px; color: var(--yellow); }

/* Structure Grid */
.structure-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 16px; }
.struct-card { background: var(--bg-inner); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.struct-title { font-size: 12px; color: var(--purple-light); font-weight: 700; }
.struct-formula { font-family: var(--font-code); color: var(--yellow); font-size: 14px; margin: 8px 0; }
.example-item { background: var(--bg-inner); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.ex-en { font-weight: 600; font-size: 16px; }
.ex-hi { color: var(--text-muted); font-size: 14px; }

/* Verbs Table */
.verb-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.filter-btn { padding: 6px 14px; border-radius: 8px; background: var(--bg-card); border: 1px solid var(--border); font-size: 14px; font-weight: 600; transition: all 0.2s; }
.filter-btn:hover, .filter-btn.active { background: var(--purple); color: white; border-color: var(--purple); }
.verb-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
.verb-table th, .verb-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 15px; }
.verb-table th { color: var(--text-muted); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
.verb-table tr:hover { background: var(--bg-hover); }
.v1 { font-weight: 700; color: var(--text-main); }
.v2 { color: var(--blue); } 
.v3 { color: var(--purple-light); } 
.vm { color: var(--green); font-family: var(--font-code); }

/* Practice & Games */
.practice-container { max-width: 800px; margin: 0 auto; padding: 20px 24px 100px; }
.mcq-question { font-size: 20px; font-weight: 600; margin-bottom: 24px; }
.mcq-options { display: flex; flex-direction: column; gap: 12px; }
.mcq-btn { padding: 16px; background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 12px; font-size: 16px; text-align: left; transition: all 0.2s; }
.mcq-btn:hover:not(:disabled) { border-color: var(--purple-light); background: var(--bg-hover); }
.mcq-btn.correct { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.mcq-btn.wrong { background: var(--red-bg); border-color: var(--red); color: var(--red); }
.arrange-sentence-area { min-height: 80px; padding: 16px; background: var(--bg-inner); border: 1.5px dashed var(--border); border-radius: 12px; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.arrange-pool { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.word-chip { padding: 10px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.2s; }
.word-chip:hover { border-color: var(--purple); transform: translateY(-2px); }
.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(7, 9, 19, 0.9); border-top: 1px solid var(--border); padding: 16px; display: none; justify-content: center; backdrop-filter: blur(10px); z-index: 100; }
.btn-primary { padding: 14px 40px; background: linear-gradient(135deg, var(--purple), var(--blue)); color: white; font-weight: 700; border-radius: 30px; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3); transition: all 0.2s; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5); }
.toast-feedback { position: fixed; top: 80px; left: 50%; transform: translate(-50%, -100px); padding: 16px 24px; border-radius: 16px; font-weight: 600; opacity: 0; transition: all 0.3s; z-index: 200; }
.toast-feedback.show { transform: translate(-50%, 0); opacity: 1; }
.toast-feedback.success { background: var(--green-bg); border: 1px solid var(--green); color: var(--green); }
.toast-feedback.error { background: var(--red-bg); border: 1px solid var(--red); color: var(--red); }
</style>
</head>
<body>

<div class="screen active" id="screen-home">
  <header class="nav-header">
    <div class="nav-brand">ENGLISH MASTERY</div>
    <div class="stat-pill">⭐ <span id="userXP">0</span> XP</div>
  </header>
  <div class="hero"><h1>Choose Your <span>Module</span></h1></div>
  <div class="modules-grid" id="homeModules"></div>
</div>

<div class="screen" id="screen-module">
  <div class="page-header"><button class="btn-back" onclick="goHome()">← Back</button></div>
  <div style="max-width: 900px; margin: 0 auto; padding: 0 24px 20px;">
    <h2 id="modTitle" style="font-size: 28px; font-weight: 800;"></h2>
    <p id="modDesc" style="color: var(--text-muted);"></p>
  </div>
  <div class="cards-container" id="moduleCards"></div>
</div>

<div class="screen" id="screen-lesson">
  <div class="page-header"><button class="btn-back" onclick="goBackToModule()">← Back</button></div>
  <div class="lesson-content" id="lessonBody"></div>
  <div class="bottom-bar" id="lessonBottomBar">
    <button class="btn-primary" onclick="startPractice()">Start Practice 🎮</button>
  </div>
</div>

<div class="screen" id="screen-practice">
  <div class="page-header"><button class="btn-back" onclick="goBackToLesson()">← Back</button></div>
  <div class="practice-container" id="practiceBody"></div>
</div>

<div class="toast-feedback" id="toastFeedback">
  <span id="toastIcon">✓</span> <span id="toastMsg">Correct!</span>
</div>

<!-- Yahan aapki files load hoti hain -->
<script src="module1.js"></script>
<script src="module2.js"></script>

<script>
/* ================= 1. FIREBASE SETUP ================= */
const FIREBASE_URL = "https://learnenglishspok-default-rtdb.asia-southeast1.firebasedatabase.app/";
let deviceId = localStorage.getItem("em_device_id") || "user_" + Math.random().toString(36).substr(2, 9);
localStorage.setItem("em_device_id", deviceId);
let userData = { xp: 0 };
async function fetchUserData() {
  try {
    const res = await fetch(`${FIREBASE_URL}users/${deviceId}.json`);
    const data = await res.json();
    if (data) { userData = data; document.getElementById("userXP").innerText = userData.xp || 0; }
  } catch (e) {}
}
async function saveUserData(addXP = 0) {
  userData.xp = (userData.xp || 0) + addXP;
  document.getElementById("userXP").innerText = userData.xp;
  try { await fetch(`${FIREBASE_URL}users/${deviceId}.json`, { method: "PUT", body: JSON.stringify(userData) }); } catch (e) {}
}
fetchUserData();

/* ================= 2. SOUND EFFECTS ================= */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  if (type === 'click') { osc.frequency.setValueAtTime(400, audioCtx.currentTime); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1); }
  else if (type === 'correct') { osc.frequency.setValueAtTime(500, audioCtx.currentTime); osc.frequency.setValueAtTime(1000, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4); osc.start(); osc.stop(audioCtx.currentTime + 0.4); }
  else if (type === 'wrong') { osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.3); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); }
}

/* ================= 3. ENGINE LOGIC ================= */
let currentModule = null, currentCard = null, currentPracticeIndex = 0, selectedWords = [];

const allModules = [];
if (typeof module1Data !== 'undefined') allModules.push(module1Data);
if (typeof module2Data !== 'undefined') allModules.push(module2Data);

function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0); }
function goHome() { playSound('click'); showScreen("screen-home"); }
function goBackToModule() { playSound('click'); document.getElementById("lessonBottomBar").style.display = "none"; showScreen("screen-module"); }
function goBackToLesson() { playSound('click'); openLesson(currentCard.id); }

function renderHome() {
  document.getElementById("homeModules").innerHTML = allModules.map(mod => `
    <div class="module-card" onclick="openModule('${mod.id}')">
      <div class="mc-icon">${mod.icon}</div>
      <div class="mc-title">${mod.title}</div>
      <div class="mc-desc">${mod.desc}</div>
    </div>
  `).join("");
}
renderHome();

function openModule(modId) {
  playSound('click');
  currentModule = allModules.find(m => m.id === modId);
  document.getElementById("modTitle").innerText = currentModule.title;
  document.getElementById("modDesc").innerText = currentModule.desc;
  document.getElementById("moduleCards").innerHTML = currentModule.cards.map((card, idx) => `
    <div class="lesson-card-item" onclick="openLesson('${card.id}')">
      <div class="lci-num">${idx + 1}</div>
      <div class="lci-info"><div class="lci-title">${card.title}</div><div class="lci-sub">${card.subtitle}</div></div>
      <div class="lci-arrow">›</div>
    </div>
  `).join("");
  showScreen("screen-module");
}

function openLesson(cardId) {
  playSound('click');
  currentCard = currentModule.cards.find(c => c.id === cardId);
  let html = `<h1 class="lesson-h1">${currentCard.title}</h1><p style="color:var(--text-muted); margin-bottom:20px;">${currentCard.subtitle}</p>`;

  // 1. INTERACTIVE (Verb Tobe)
  if (currentCard.type === "interactive") {
    html += `<div class="content-section"><div class="cs-header">📌 Click on any word to see its Structure & Translation:</div>
      <div class="clickable-grid">`;
    currentCard.interactiveData.forEach((item, i) => {
      html += `<button class="click-btn" onclick="showDetail(${i}, this)">${item.word}</button>`;
    });
    html += `</div><div id="detailContainer"></div></div>`;
    document.getElementById("lessonBottomBar").style.display = "none";
  }

  // 2. TEACH MODE (Modals & Semi Modals)
  if (currentCard.type === "teach") {
    currentCard.content.forEach((sec, i) => {
      html += `<div class="content-section"><div class="cs-header">${i+1}. ${sec.title}</div>${sec.text ? `<div class="cs-text">${sec.text}</div>` : ""}${sec.formula ? `<div class="formula-box">${sec.formula}</div>` : ""}</div>`;
    });
    if (currentCard.structure) {
      html += `<div class="content-section"><div class="cs-header">Structure with Examples</div><div class="structure-grid">`;
      currentCard.structure.forEach(st => { html += `<div class="struct-card"><div class="struct-title">${st.type}</div><div class="struct-formula">${st.formula}</div><div class="ex-en">${st.ex}</div><div class="ex-hint">💡 ${st.hint}</div></div>`; });
      html += `</div></div>`;
    }
    document.getElementById("lessonBottomBar").style.display = "flex";
  }

  // 3. VERBS A-Z
  if (currentCard.type === "verbs") {
    html += `<div class="content-section"><div class="cs-header">A-Z Verb Forms (V1, V2, V3)</div><div class="verb-filters" id="verbFilters"></div><div style="overflow-x:auto;"><div id="verbTableContainer"></div></div></div>`;
    document.getElementById("lessonBottomBar").style.display = "none";
  }

  // 4. SPOKEN MODE
  if (currentCard.type === "spoken") {
    html += `<div class="content-section"><div class="cs-header">Daily Use Sentences</div>`;
    currentCard.spokenList.forEach(cat => {
      html += `<h3 style="margin: 20px 0 10px; color: var(--purple-light); font-size: 18px;">${cat.category}</h3>`;
      cat.sentences.forEach(s => { html += `<div class="example-item"><div class="ex-en">${s.en}</div><div class="ex-hi">${s.hi}</div></div>`; });
    });
    html += `</div>`;
    document.getElementById("lessonBottomBar").style.display = "none";
  }

  document.getElementById("lessonBody").innerHTML = html;
  showScreen("screen-lesson");

  if (currentCard.type === "verbs") {
    let letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    let filters = `<button class="filter-btn active" onclick="filterVerbs('ALL', this)">ALL</button>`;
    letters.forEach(l => { filters += `<button class="filter-btn" onclick="filterVerbs('${l}', this)">${l}</button>`; });
    document.getElementById("verbFilters").innerHTML = filters;
    renderVerbTable(currentCard.verbList, 'ALL');
  }
}

/* === LOGIC FOR INTERACTIVE (was, is, etc) === */
function showDetail(index, btn) {
  playSound('click');
  document.querySelectorAll('.click-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  
  const data = currentCard.interactiveData[index];
  const container = document.getElementById("detailContainer");
  
  let html = `<div class="detail-view active">
    <div class="dv-header">${data.word} = ${data.meaning} <span style="font-size:14px; color:var(--text-muted); font-weight:normal;">(${data.tense})</span></div>
    <div class="dv-row"><div class="dv-title">Simple Sentence</div><div class="dv-en">${data.simple.en}</div><div class="dv-hi">${data.simple.hi}</div></div>
    <div class="dv-row"><div class="dv-title">Negative</div><div class="dv-en">${data.negative.en}</div><div class="dv-hi">${data.negative.hi}</div></div>
    <div class="dv-row"><div class="dv-title">WH Question</div><div class="dv-en">${data.wh.en}</div><div class="dv-hi">${data.wh.hi}</div></div>
  </div>`;
  
  container.innerHTML = html;
}

/* === LOGIC FOR VERBS A-Z === */
function renderVerbTable(list, filterLetter) {
  let filtered = filterLetter === 'ALL' ? list : list.filter(v => v.v1[0].toUpperCase() === filterLetter);
  document.getElementById("verbTableContainer").innerHTML = `
    <table class="verb-table">
      <thead><tr><th>V1 (Base)</th><th>V2 (Past)</th><th>V3 (Past Participle)</th><th>Hindi Meaning</th></tr></thead>
      <tbody>
        ${filtered.map(v => `<tr><td class="v1">${v.v1}</td><td class="v2">${v.v2}</td><td class="v3">${v.v3}</td><td class="vm">${v.hi}</td></tr>`).join("")}
      </tbody>
    </table>
  `;
}
function filterVerbs(letter, btn) {
  playSound('click');
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderVerbTable(currentCard.verbList, letter);
}

/* ================= 4. PRACTICE GAMES ================= */
function startPractice() {
  playSound('click'); currentPracticeIndex = 0; showScreen("screen-practice"); renderPracticeQuestion();
}

function renderPracticeQuestion() {
  const container = document.getElementById("practiceBody");
  if (!currentCard.practice || currentPracticeIndex >= currentCard.practice.length) {
    container.innerHTML = `<div style="text-align:center; padding: 50px 0;"><div style="font-size: 60px;">🎉</div><h2>Practice Complete!</h2><p style="color: var(--text-muted); margin-bottom: 20px;">+10 XP Earned</p><button class="btn-primary" onclick="goBackToModule()">Back to Module</button></div>`;
    saveUserData(10); playSound('correct'); return;
  }

  const q = currentCard.practice[currentPracticeIndex];
  if (q.type === "mcq") {
    container.innerHTML = `<div class="mcq-question">${q.q}</div><div class="mcq-options" id="mcqOptions">${q.options.map((opt, i) => `<button class="mcq-btn" onclick="checkMCQ(${i}, ${q.ans})">${opt}</button>`).join("")}</div>`;
  } 
  else if (q.type === "arrange") {
    selectedWords = [];
    const shuffled = [...q.words].sort(() => Math.random() - 0.5);
    container.innerHTML = `<div class="mcq-question">${q.q}</div><div class="arrange-sentence-area" id="arrangeArea"></div><div class="arrange-pool" id="arrangePool">${shuffled.map((w, i) => `<div class="word-chip" id="word-${i}" onclick="selectWord('${w}', ${i})">${w}</div>`).join("")}</div><div style="text-align: center;"><button class="btn-primary" id="btnCheckArrange" onclick="checkArrange('${q.ans}')" disabled>Check Answer</button></div>`;
  }
}

function checkMCQ(selected, correct) {
  const btns = document.querySelectorAll("#mcqOptions .mcq-btn");
  btns.forEach(b => b.disabled = true);
  if (selected === correct) {
    btns[selected].classList.add("correct"); playSound('correct'); showToast("Correct!", true);
    setTimeout(() => { currentPracticeIndex++; renderPracticeQuestion(); }, 1500);
  } else {
    btns[selected].classList.add("wrong"); btns[correct].classList.add("correct"); playSound('wrong'); showToast("Wrong!", false);
    setTimeout(() => { currentPracticeIndex++; renderPracticeQuestion(); }, 2500);
  }
}

function selectWord(word, id) {
  playSound('click'); selectedWords.push({ word, id });
  document.getElementById(`word-${id}`).style.display = 'none';
  document.getElementById("arrangeArea").innerHTML = selectedWords.map((item, i) => `<div class="word-chip" onclick="removeWord(${i})">${item.word}</div>`).join("");
  document.getElementById("btnCheckArrange").disabled = selectedWords.length === 0;
}

function removeWord(index) {
  playSound('click'); const removed = selectedWords.splice(index, 1)[0];
  document.getElementById(`word-${removed.id}`).style.display = '';
  document.getElementById("arrangeArea").innerHTML = selectedWords.map((item, i) => `<div class="word-chip" onclick="removeWord(${i})">${item.word}</div>`).join("");
  document.getElementById("btnCheckArrange").disabled = selectedWords.length === 0;
}

function checkArrange(correctAns) {
  const userAns = selectedWords.map(w => w.word).join(" ");
  if (userAns.trim().toLowerCase() === correctAns.trim().toLowerCase()) {
    playSound('correct'); showToast("Correct!", true);
    setTimeout(() => { currentPracticeIndex++; renderPracticeQuestion(); }, 1500);
  } else {
    playSound('wrong'); showToast("Try again", false);
    setTimeout(() => { selectedWords = []; document.querySelectorAll('#arrangePool .word-chip').forEach(el => el.style.display = ''); document.getElementById("arrangeArea").innerHTML = ""; document.getElementById("btnCheckArrange").disabled = true; }, 1000);
  }
}

let toastTimer;
function showToast(msg, isSuccess) {
  const toast = document.getElementById("toastFeedback");
  toast.className = `toast-feedback show ${isSuccess ? 'success' : 'error'}`;
  document.getElementById("toastIcon").innerText = isSuccess ? "✓" : "✗";
  document.getElementById("toastMsg").innerText = msg;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}
</script>
</body>
</html>
