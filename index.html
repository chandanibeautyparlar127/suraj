<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Grammar Master</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
body { background:linear-gradient(135deg,#667eea,#764ba2); min-height:100vh; padding:20px; }
#app { max-width:1000px; margin:0 auto; }
header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; color:#fff; }
header h1 { font-size:1.5rem; }
#backBtn { padding:8px 16px; border:none; border-radius:8px; background:rgba(255,255,255,.2); color:#fff; cursor:pointer; display:none; font-size:.9rem; }
#backBtn:hover { background:rgba(255,255,255,.35); }
#breadcrumb { color:rgba(255,255,255,.85); margin-bottom:15px; font-size:.9rem; }
#content { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:15px; }
.card { background:#fff; border-radius:12px; padding:20px; cursor:pointer; transition:.2s; box-shadow:0 4px 15px rgba(0,0,0,.1); }
.card:hover { transform:translateY(-5px); box-shadow:0 8px 25px rgba(0,0,0,.2); }
.card-icon { font-size:2rem; margin-bottom:10px; }
.card-title { font-weight:600; color:#333; }
.card-sub { font-size:.85rem; color:#666; margin-top:6px; }
.detail-view { background:#fff; border-radius:12px; padding:25px; color:#333; grid-column:1/-1; }
.detail-view h2 { color:#667eea; margin-bottom:15px; }
.section { margin-bottom:20px; padding-bottom:15px; border-bottom:1px solid #eee; }
.section-title { font-weight:600; color:#764ba2; margin-bottom:10px; font-size:1.05rem; }
.structure { background:#eef2ff; padding:10px 14px; border-radius:6px; margin:8px 0; font-family:monospace; color:#333; }
.example { padding:8px 12px; margin:6px 0; background:#f9f9f9; border-left:3px solid #667eea; border-radius:4px; }
.example .en { font-weight:500; color:#222; }
.example .hi { color:#666; font-size:.9rem; display:block; margin-top:2px; }
.practice-tabs { display:flex; gap:10px; margin:15px 0; flex-wrap:wrap; }
.ptab { padding:8px 18px; border:2px solid #667eea; background:#fff; color:#667eea; border-radius:6px; cursor:pointer; font-weight:600; }
.ptab.active { background:#667eea; color:#fff; }
.question-box { background:#f5f7ff; padding:18px; border-radius:8px; margin-bottom:15px; }
.question-box .q { font-size:1.1rem; margin-bottom:12px; color:#333; }
.options { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.option { padding:12px; border:2px solid #ddd; border-radius:6px; cursor:pointer; text-align:center; transition:.2s; background:#fff; }
.option:hover { border-color:#667eea; }
.option.correct { background:#4caf50; color:#fff; border-color:#4caf50; }
.option.wrong { background:#f44336; color:#fff; border-color:#f44336; }
input[type="text"] { width:100%; padding:12px; border:2px solid #ddd; border-radius:6px; font-size:1rem; margin:10px 0; }
.btn { padding:10px 22px; border:none; border-radius:6px; background:#667eea; color:#fff; cursor:pointer; font-weight:600; font-size:1rem; margin-right:8px; }
.btn:hover { background:#5568d3; }
.feedback { padding:12px; margin:10px 0; border-radius:6px; font-weight:600; }
.feedback.correct { background:#e8f5e9; color:#2e7d32; }
.feedback.wrong { background:#ffebee; color:#c62828; }
.progress { color:#666; margin-bottom:10px; font-size:.9rem; font-weight:600; }
.reveal { background:#fff3e0; padding:12px; border-radius:6px; margin:10px 0; color:#e65100; }
@media(max-width:600px) { .options{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>📚 English Grammar Master</h1>
    <button id="backBtn" onclick="goBack()">← Back</button>
  </header>
  <div id="breadcrumb"></div>
  <div id="content"></div>
</div>
<script src="module1.js"></script>
<script src="module2.js"></script>
<script src="practice.js"></script>
<script src="app.js"></script>
</body>
</html>
