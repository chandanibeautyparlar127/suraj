<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 4 — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070913;--surface:#101425;--purple:#8b5cf6;--purple-light:#a78bfa;--blue:#3b82f6;--text:#f8fafc;--text-muted:#94a3b8;--border:rgba(255,255,255,.08);--grad:linear-gradient(135deg,#a78bfa,#8b5cf6,#3b82f6)}
body{background:var(--bg);color:var(--text);font-family:"Outfit",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;overflow:hidden}
.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(120px)}
.orb-p{width:520px;height:520px;background:#8b5cf6;top:-160px;left:-120px;opacity:.4}
.orb-b{width:560px;height:560px;background:#3b82f6;bottom:-200px;right:-200px;opacity:.3}
.box{position:relative;z-index:1;max-width:520px;text-align:center;padding:48px 32px;border-radius:20px;background:var(--surface);border:1px solid var(--border);box-shadow:0 18px 50px -20px rgba(0,0,0,.85);animation:fadeUp .8s cubic-bezier(.22,1,.36,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
.icon{width:72px;height:72px;border-radius:20px;background:var(--grad);display:grid;place-items:center;font-size:2rem;margin:0 auto 24px;box-shadow:0 12px 34px -14px rgba(139,92,246,.9)}
h1{font-size:1.8rem;font-weight:700;margin-bottom:12px;letter-spacing:-.02em}
p{color:var(--text-muted);font-weight:300;margin-bottom:28px;line-height:1.7}
a{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:999px;background:var(--grad);color:#fff;text-decoration:none;font-weight:600;font-size:.94rem;transition:transform .25s,box-shadow .25s;box-shadow:0 12px 34px -14px rgba(139,92,246,.95)}
a:hover{transform:translateY(-2px);box-shadow:0 18px 46px -14px rgba(139,92,246,1)}
</style>
</head>
<body>
<div class="orbs"><div class="orb orb-p"></div><div class="orb orb-b"></div></div>
<div class="box">
  <div class="icon">🚧</div>
  <h1>Module 4</h1>
  <p>Data structure abhi decide nahi hua hai. Placeholder file ready hai — jab content finalize hoga, yahan update kar denge.</p>
  <a href="index.html">← Back to Home</a>
</div>
</body>
</html>
